<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>YSA 16th ↔ 49th Boundary Planner</title>
<style>
  :root { --red:#dc2626; --blue:#2563eb; --bg:#f4f5f7; --panel:#fff; --line:#e2e4e8; --ink:#1a1a2e; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--ink); color:#fff; padding:12px 16px; position:sticky; top:0; z-index:30; }
  header h1 { font-size:16px; margin:0 0 8px; }
  .tally { display:flex; gap:10px; flex-wrap:wrap; align-items:center; font-size:14px; }
  .pill { border-radius:999px; padding:4px 12px; font-weight:700; }
  .pill.red { background:rgba(220,38,38,.20); color:#fca5a5; }
  .pill.blue { background:rgba(37,99,235,.22); color:#93c5fd; }
  .note { font-size:12px; opacity:.75; }
  .btns { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; }
  button { font:inherit; border:0; border-radius:8px; padding:6px 12px; cursor:pointer; background:#374151; color:#fff; }
  button.ghost { background:transparent; border:1px solid #4b5563; }
  button:hover { filter:brightness(1.12); }
  .hint { padding:10px 16px; font-size:13px; color:#5b6270; background:#eef1f6; border-bottom:1px solid var(--line); }
  .layout { display:flex; align-items:flex-start; }
  .stage { flex:1 1 auto; min-width:0; padding:14px; }
  .mapc { position:relative; width:100%; max-width:1100px; margin:0 auto; border:1px solid var(--line); border-radius:8px; overflow:hidden; background:#fff; }
  .mapc > img.base { width:100%; display:block; user-select:none; -webkit-user-drag:none; }

  .piece { position:absolute; cursor:grab; touch-action:none; user-select:none; }
  .piece.dragging { box-shadow:0 3px 14px rgba(0,0,0,.45); z-index:20; }
  .piece > img.pimg { width:100%; height:auto; display:block; border-radius:4px; pointer-events:none; -webkit-user-drag:none; }
  .piece .tint { position:absolute; inset:0; background:var(--red); opacity:.5; pointer-events:none;
                 -webkit-mask-size:100% 100%; mask-size:100% 100%; -webkit-mask-repeat:no-repeat; mask-repeat:no-repeat; border-radius:4px; }
  .piece.blue .tint { background:var(--blue); }
  .piece .plabel { position:absolute; top:2px; left:2px; font-size:11px; font-weight:800; color:#fff; text-shadow:0 1px 2px #000;
                   background:rgba(0,0,0,.4); padding:1px 6px; border-radius:6px; pointer-events:none; white-space:nowrap; }
  .piece .rz { position:absolute; right:-2px; bottom:-2px; width:18px; height:18px; background:rgba(0,0,0,.5);
               border-radius:8px 0 0 0; cursor:nwse-resize; touch-action:none; }
  /* fallback rectangle (before the PNG exists) */
  .piece.fallback { border:2.5px solid var(--red); background:rgba(220,38,38,.42); border-radius:8px;
                    display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; font-size:12px; text-shadow:0 1px 2px #000; }
  .piece.fallback.blue { border-color:var(--blue); background:rgba(37,99,235,.42); }
  .piece.fallback > img.pimg, .piece.fallback .tint { display:none; }
  .piece.fallback .plabel { position:static; background:none; text-shadow:0 1px 2px #000; }

  .panel { flex:0 0 310px; background:var(--panel); border-left:1px solid var(--line); padding:12px; position:sticky; top:0; align-self:flex-start; max-height:100vh; overflow:auto; }
  .panel h2 { font-size:12px; text-transform:uppercase; letter-spacing:.04em; color:#6b7280; margin:0 0 8px; }
  .stt { width:100%; border-collapse:collapse; font-size:12.5px; }
  .stt th, .stt td { padding:3px 4px; text-align:right; white-space:nowrap; }
  .stt th:first-child, .stt td:first-child { text-align:left; color:#4b5563; white-space:normal; }
  .stt th.c16, .stt td.c16 { color:var(--red); font-weight:700; }
  .stt th.c49, .stt td.c49 { color:var(--blue); font-weight:700; }
  .stt tr.spacer td { padding:3px; }
  .stt tr.group td:first-child { font-weight:700; color:var(--ink); padding-top:7px; }
  .stt tr.tot td { border-top:1px solid var(--line); }
  .smsg { font-size:12px; color:#5b6270; line-height:1.5; background:#eef1f6; padding:9px 10px; border-radius:8px; }
  .statnote { font-size:11px; color:#b45309; margin-top:6px; }
  .wrow { display:flex; align-items:center; gap:6px; padding:6px 4px; border-radius:8px; }
  .wrow:hover, .wrow.hot { background:#f0f3ff; }
  .sw { width:12px; height:12px; border-radius:3px; flex:0 0 auto; background:var(--red); }
  .wrow.blue .sw { background:var(--blue); }
  .wn { flex:1 1 auto; font-size:13px; min-width:0; }
  .full { font-size:12px; color:#6b7280; text-decoration:none; padding:0 4px; }
  .choice { display:flex; }
  .choice button { padding:3px 8px; font-size:12px; border:1px solid var(--line); background:transparent; color:#6b7280; font-weight:700; }
  .choice button:first-child { border-radius:6px 0 0 6px; }
  .choice button:last-child { border-radius:0 6px 6px 0; border-left:0; }
  .choice button.on16 { background:var(--red); color:#fff; border-color:var(--red); }
  .choice button.on49 { background:var(--blue); color:#fff; border-color:var(--blue); }
  @media (max-width:840px) {
    .layout { flex-direction:column; }
    .panel { flex-basis:auto; border-left:0; border-top:1px solid var(--line); max-height:none; position:static; width:100%; }
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1117; --panel:#171a22; --line:#2a2e39; --ink:#e6e8ee; }
    .hint { background:#1a1e28; color:#9aa0aa; }
    button { background:#2a2f3c; }
    .choice button { color:#9aa0aa; }
    .wrow:hover, .wrow.hot { background:#1e2233; }
    .mapc { background:#11131a; }
  }
</style>
</head>
<body>
<header>
  <h1>🗺️ YSA 16th ↔ 49th Boundary Planner</h1>
  <div class="tally">
    <span class="pill red" id="tallyRed">16th: 0</span>
    <span class="pill blue" id="tallyBlue">49th: 0</span>
    <span class="note" id="tallyNote"></span>
    <span class="btns">
      <button class="ghost" onclick="setAll('16')">All → 16th</button>
      <button class="ghost" onclick="setAll('49')">All → 49th</button>
      <button class="ghost" onclick="copyLink()">🔗 Copy Link</button>
      <button class="ghost" onclick="resetAll()">↺ Reset</button>
    </span>
  </div>
</header>

<div class="hint">
  <strong>Drag</strong> each ward piece onto its spot · drag the <strong>bottom-right corner</strong> to resize (aspect stays locked) · <strong>tap</strong> a piece (or use the list) to switch it <span style="color:#dc2626;font-weight:700;">16th</span> / <span style="color:#2563eb;font-weight:700;">49th</span>. Layout saves automatically.
</div>

<div class="layout">
  <div class="stage">
    <div class="mapc" id="mapc">
      <img class="base" src="maps/overview.jpg" alt="Orem YSA 16th &amp; 49th overview" id="baseimg">
      <!-- pieces injected here -->
    </div>
  </div>
  <div class="panel">
    <h2>Member Stats</h2>
    <div id="statsBody"><div class="smsg">Loading…</div></div>
    <button class="ghost" id="detectBtn" style="margin-top:8px;font-size:12px;display:none;" onclick="detectWards()">🏠 Write detected wards to sheet (to review)</button>
    <h2 style="margin-top:16px;">Geographic Wards</h2>
    <div id="wardList"></div>
  </div>
</div>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbz-8U9EqHl8nvJOypAvg0Q09Y6W6pShuJfvoaJda22LUqYPDZRRSytKZ4go5HERiyhr/exec';
  const C16='16', C49='49', STORE='ysaPlacePlan_v2';
  const WARDS = [
    {id:'ch1', name:'Cherry Hill 1st'}, {id:'ch2', name:'Cherry Hill 2nd'},
    {id:'ch3', name:'Cherry Hill 3rd'}, {id:'ch5', name:'Cherry Hill 5th'},
    {id:'ch6', name:'Cherry Hill 6th'}, {id:'ch7', name:'Cherry Hill 7th'},
    {id:'ch9', name:'Cherry Hill 9th'},
    {id:'sw1', name:'Stonewood 1st'}, {id:'sw2', name:'Stonewood 2nd'},
    {id:'sw3', name:'Stonewood 3rd'}, {id:'sw4', name:'Stonewood 4th'},
    {id:'sw5', name:'Stonewood 5th'}
  ];
  const pngFor = id => 'maps/' + id + '.png';   // draggable piece image (provided by you)
  const jpgFor = id => 'maps/' + id + '.jpg';   // full ward poster (for the "map" link)
  function abbr(n){ const m=n.match(/(\d+)/); const pre=n.replace(/\s*\d.*/,'').split(/\s+/).map(w=>w[0]).join('').toUpperCase(); return pre+' '+(m?m[1]:''); }

  // state[id] = { x,y,w (percent of map), h (percent; only used for fallback rectangles), c:'16'|'49' }
  let state = {};
  function defaultState(){
    const st={};
    WARDS.forEach((w,i)=>{ const col=i%4, row=Math.floor(i/4); st[w.id]={ x:2+col*15, y:2+row*8, w:13, h:6.5, c:C16 }; });
    return st;
  }
  function mergeState(o){ const d=defaultState(); WARDS.forEach(w=>{ if(o[w.id]) d[w.id]=Object.assign(d[w.id],o[w.id]); }); return d; }
  function loadState(){
    const h=(location.hash||'').replace(/^#/,'');
    if(h){ try{ const o=JSON.parse(decodeURIComponent(escape(atob(h)))); if(o&&o.ch1) return mergeState(o); }catch(e){} }
    try{ const s=localStorage.getItem(STORE); if(s) return mergeState(JSON.parse(s)); }catch(e){}
    return defaultState();
  }
  function save(){ try{ localStorage.setItem(STORE, JSON.stringify(state)); }catch(e){} }

  const mapc = document.getElementById('mapc');
  const pieces = {};

  WARDS.forEach(w => {
    const p = document.createElement('div');
    p.className='piece fallback'; p.id='pc-'+w.id; p.title=w.name+' Ward';
    const url = pngFor(w.id);
    p.innerHTML =
      '<img class="pimg" alt="'+w.name+'">' +
      '<div class="tint" style="-webkit-mask-image:url(\''+url+'\');mask-image:url(\''+url+'\')"></div>' +
      '<span class="plabel">'+abbr(w.name)+'</span>' +
      '<div class="rz" data-rz="1"></div>';
    const img = p.querySelector('img.pimg');
    img.addEventListener('load', ()=>{ p.classList.remove('fallback'); applyPiece(w.id); });
    img.addEventListener('error', ()=>{ p.classList.add('fallback'); applyPiece(w.id); });
    img.src = url;   // triggers load or error
    p.addEventListener('pointerdown', e => startDrag(e, w.id));
    pieces[w.id]=p; mapc.appendChild(p);
  });

  function applyPiece(id){
    const s=state[id], p=pieces[id];
    p.style.left=s.x+'%'; p.style.top=s.y+'%'; p.style.width=s.w+'%';
    p.style.height = p.classList.contains('fallback') ? ((s.h||6.5)+'%') : 'auto';
    p.classList.toggle('blue', s.c===C49);
  }

  // ---- drag / resize / tap ----
  let act=null;
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function startDrag(e, id){
    e.preventDefault();
    const isRz = e.target && e.target.dataset && e.target.dataset.rz;
    const r = mapc.getBoundingClientRect();
    act = { id, mode:isRz?'resize':'drag', sx:e.clientX, sy:e.clientY, rw:r.width, rh:r.height, orig:Object.assign({},state[id]), moved:false };
    pieces[id].classList.add('dragging');
    try{ e.target.setPointerCapture(e.pointerId); }catch(_){}
  }
  function onMove(e){
    if(!act) return;
    const dxp=(e.clientX-act.sx)/act.rw*100, dyp=(e.clientY-act.sy)/act.rh*100;
    if(Math.abs(e.clientX-act.sx)+Math.abs(e.clientY-act.sy) > 4) act.moved=true;
    const s=state[act.id], p=pieces[act.id];
    if(act.mode==='drag'){
      const hpc = p.offsetHeight/act.rh*100;
      s.x=clamp(act.orig.x+dxp, 0, 100-s.w);
      s.y=clamp(act.orig.y+dyp, 0, Math.max(0,100-hpc));
    } else { // resize — width only for images (aspect locked); width+height for fallback rects
      s.w=clamp(act.orig.w+dxp, 4, 100-s.x);
      if(p.classList.contains('fallback')) s.h=clamp((act.orig.h||6.5)+dyp, 3, 100-s.y);
    }
    applyPiece(act.id);
  }
  function onUp(){
    if(!act) return;
    pieces[act.id].classList.remove('dragging');
    if(!act.moved && act.mode==='drag') toggleWard(act.id);   // tap = flip color
    act=null; save();
  }
  window.addEventListener('pointermove', onMove);
  window.addEventListener('pointerup', onUp);
  window.addEventListener('pointercancel', onUp);

  // ---- ward list panel ----
  const listEl=document.getElementById('wardList');
  WARDS.forEach(w=>{
    const row=document.createElement('div');
    row.className='wrow'; row.id='row-'+w.id;
    row.innerHTML='<span class="sw"></span><span class="wn">'+w.name+'</span>'+
      '<a class="full" href="'+jpgFor(w.id)+'" target="_blank" title="Open full ward map">🔍</a>'+
      '<span class="choice"><button id="l16-'+w.id+'" onclick="setWard(\''+w.id+'\',\'16\')">16</button>'+
      '<button id="l49-'+w.id+'" onclick="setWard(\''+w.id+'\',\'49\')">49</button></span>';
    row.addEventListener('mouseenter',()=>flashPiece(w.id,true));
    row.addEventListener('mouseleave',()=>flashPiece(w.id,false));
    listEl.appendChild(row);
  });
  function flashPiece(id,on){
    pieces[id].style.outline = on ? '3px solid #111' : '';
    pieces[id].style.zIndex = on ? '25' : '';
    const row=document.getElementById('row-'+id); if(row) row.classList.toggle('hot',on);
  }

  function syncRow(id){
    const blue=state[id].c===C49;
    const row=document.getElementById('row-'+id); row.classList.toggle('blue',blue);
    document.getElementById('l16-'+id).className = blue?'':'on16';
    document.getElementById('l49-'+id).className = blue?'on49':'';
  }
  function updateTally(){
    let a=0,b=0; WARDS.forEach(w=> state[w.id].c===C49 ? b++ : a++);
    document.getElementById('tallyRed').textContent='16th: '+a;
    document.getElementById('tallyBlue').textContent='49th: '+b;
    document.getElementById('tallyNote').textContent=a+b+' geographic wards';
  }
  function setWard(id,c){ state[id].c=c; applyPiece(id); syncRow(id); updateTally(); updateStats(); save(); }
  function toggleWard(id){ setWard(id, state[id].c===C16?C49:C16); }
  function setAll(c){ WARDS.forEach(w=>state[w.id].c=c); WARDS.forEach(w=>{applyPiece(w.id);syncRow(w.id);}); updateTally(); updateStats(); save(); }
  function resetAll(){ if(!confirm('Reset piece positions AND colors back to the start?'))return; state=defaultState(); WARDS.forEach(w=>{applyPiece(w.id);syncRow(w.id);}); updateTally(); updateStats(); save(); }

  // ---- member stats (fetched from the Varsity YSAs sheet, rolled up live) ----
  const STAT_ROWS = [
    {k:'total', label:'Total Members', group:true},
    {k:'endowed', label:'Endowed'},
    {k:'endowedCTR', label:'Endowed w/ CTR'},
    {k:'callings', label:'With Callings'},
    {sp:true},
    {k:'women', label:'Total Women', group:true},
    {k:'endowedWomen', label:'Endowed Women'},
    {k:'endowedWomenCTR', label:'Endowed Women w/ CTR'},
    {sp:true},
    {k:'men', label:'Men', group:true},
    {k:'endowedMen', label:'Endowed Men'},
    {k:'endowedMenCTR', label:'Endowed Men w/ CTR'}
  ];
  const STAT_KEYS = STAT_ROWS.filter(r=>r.k).map(r=>r.k);
  let wardStats = null;

  function buildStatsTable(){
    let h='<table class="stt"><tr><th></th><th class="c16">16th</th><th class="c49">49th</th></tr>';
    STAT_ROWS.forEach(r=>{
      if(r.sp){ h+='<tr class="spacer"><td colspan="3"></td></tr>'; return; }
      h+='<tr'+(r.group?' class="group"':'')+'><td>'+r.label+'</td>'+
         '<td class="c16" id="s16-'+r.k+'">0</td><td class="c49" id="s49-'+r.k+'">0</td></tr>';
    });
    h+='</table>';
    document.getElementById('statsBody').innerHTML = h;
  }
  function updateStats(){
    if(!wardStats) return;
    const s16={}, s49={}; STAT_KEYS.forEach(k=>{s16[k]=0;s49[k]=0;});
    WARDS.forEach(w=>{ const st=wardStats[w.id]; if(!st) return; const t=state[w.id].c===C49?s49:s16; STAT_KEYS.forEach(k=> t[k]+=(st[k]||0)); });
    STAT_KEYS.forEach(k=>{
      const a=document.getElementById('s16-'+k), b=document.getElementById('s49-'+k);
      if(a) a.textContent=s16[k]; if(b) b.textContent=s49[k];
    });
  }
  function loadStats(){
    const uid = new URLSearchParams(location.search).get('uid');
    const box = document.getElementById('statsBody');
    const detectBtn = document.getElementById('detectBtn');
    if(!uid){ box.innerHTML='<div class="smsg">Open this planner from the app’s <b>Admin Tools</b> button so it can load member stats.</div>'; return; }
    fetch(API_URL+'?action=getVarsityStats&userId='+encodeURIComponent(uid))
      .then(r=>r.json())
      .then(d=>{
        if(!d || d.success===false){ box.innerHTML='<div class="smsg">Stats unavailable: '+((d&&d.error)||'error')+'</div>'; return; }
        if(!d.geoColumnFound){ box.innerHTML='<div class="smsg">Add member <b>addresses</b> to the “Varsity YSAs” sheet (Orem grid format, e.g. <i>1850 S 500 W</i>) — the app reads each address and figures out the ward automatically. (A manual <b>Geographic Ward</b> column also works and overrides detection.)</div>'; return; }
        wardStats = d.wards || {};
        buildStatsTable(); updateStats();
        detectBtn.style.display = '';
        if((d.matched||0)===0){
          box.insertAdjacentHTML('beforeend','<div class="smsg" style="margin-top:6px;">No members matched yet — add addresses (like <i>1850 S 500 W</i>) or a Geographic Ward column.</div>');
        }
        if(d.unmatched>0){
          const n=document.createElement('div'); n.className='statnote';
          n.textContent='⚠️ '+d.unmatched+' member(s) couldn’t be placed from their address (e.g., far-west edge or a named street). Fill their Geographic Ward in the sheet by hand.';
          box.appendChild(n);
        }
      })
      .catch(()=>{ box.innerHTML='<div class="smsg">Couldn’t reach the stats service.</div>'; });
  }

  function detectWards(){
    const uid = new URLSearchParams(location.search).get('uid');
    if(!uid){ alert('Open this planner from Admin Tools to use this.'); return; }
    const btn=document.getElementById('detectBtn'); const o=btn.textContent; btn.disabled=true; btn.textContent='Detecting…';
    fetch(API_URL+'?action=detectGeographicWards&userId='+encodeURIComponent(uid))
      .then(r=>r.json()).then(d=>{
        btn.disabled=false; btn.textContent=o;
        if(!d || d.success===false){ alert('Failed: '+((d&&d.error)||'error')); return; }
        alert('Detected wards written to the “Geographic Ward” column of the sheet:\n\n• Filled from address: '+d.filled+'\n• Kept (already set): '+d.kept+'\n• Couldn’t match: '+d.unmatched+'\n\nUnmatched rows were left blank — review the sheet and fill those in by hand.');
        wardStats=null; loadStats();
      }).catch(()=>{ btn.disabled=false; btn.textContent=o; alert('Couldn’t reach the service.'); });
  }
  window.detectWards=detectWards;
  function copyLink(){
    const hash = btoa(unescape(encodeURIComponent(JSON.stringify(state))));
    const url = location.origin+location.pathname+'#'+hash;
    (navigator.clipboard?navigator.clipboard.writeText(url):Promise.reject())
      .then(()=>flash('Link copied — reproduces this exact map (positions + colors)'))
      .catch(()=>prompt('Copy this link:',url));
  }
  function flash(m){ const n=document.getElementById('tallyNote'); const o=n.textContent; n.textContent=m; setTimeout(()=>n.textContent=o,2400); }

  window.setAll=setAll; window.resetAll=resetAll; window.copyLink=copyLink; window.setWard=setWard;

  // ---- init ----
  state = loadState();
  WARDS.forEach(w=>{ applyPiece(w.id); syncRow(w.id); });
  updateTally();
  loadStats();
</script>
</body>
</html>
