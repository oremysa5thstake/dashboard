<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sheet Views — Orem YSA 5th Stake</title>
<link rel="icon" type="image/svg+xml" href="icon-sheets.svg">
<link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator_simple.min.css">
<style>
  :root{
    /* Pulled from the spreadsheet's own conditional formatting rules, so the grid
       reads the way the sheet does. */
    --cf-canceled:#666666;
    --cf-paused:#E06666;
    --cf-released-bg:#FCE5CD;
    --cf-released-fg:#783F04;
    --cf-stake-fg:#351C75;
    --cf-ward-fg:#1155CC;
    --cf-ticked:#A4C2F4;
    --cf-na-bg:#B7B7B7;
    --cf-na-fg:#999999;
    --cf-due-bg:#EA9999;
    --cf-due-fg:#CC0000;
    --cf-allapproved:#B7E1CD;
    --cf-approved:#6AA84F;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;background:#f5f6f8;color:#222;
  }
  header{
    background:#fff;border-bottom:1px solid #e2e5e9;flex:none;
    padding:10px 16px 0;
  }
  .titlebar{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.01em}
  h1 .who{font-weight:400;color:#777;margin-left:8px;font-size:13px}
  .tabs{display:flex;gap:2px;overflow-x:auto}
  .tab{
    padding:9px 15px;font-size:13px;font-weight:600;color:#666;background:none;
    border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;
  }
  .tab:hover{color:#222}
  .tab.active{color:#1a6159;border-bottom-color:#1a6159}
  .tab .n{font-weight:400;opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}
  .toolbar{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none;
    padding:9px 16px;background:#fff;border-bottom:1px solid #e2e5e9;
  }
  input[type=text],select{
    font:inherit;font-size:13px;padding:5px 8px;border:1px solid #ccd1d6;border-radius:5px;
  }
  input[type=text]{flex:1 1 240px;min-width:150px}
  button{
    font:inherit;font-size:13px;font-weight:600;padding:5px 11px;border-radius:5px;
    border:1px solid #ccd1d6;background:#fff;cursor:pointer;
  }
  button:hover{background:#f2f4f6}
  button:disabled{opacity:.5;cursor:default}
  .meta{font-size:12px;color:#777;margin-left:auto;font-variant-numeric:tabular-nums}
  #grid{flex:1;min-height:0;margin:0 8px 8px}
  .banner{
    padding:7px 16px;font-size:12.5px;background:#fff8e1;border-bottom:1px solid #f0e0a8;flex:none;
  }
  .banner.demo{background:#e8f5e9;border-bottom-color:#b9dfbc}
  .banner.err{background:#fdecea;border-bottom-color:#f5c2bd;color:#8a1c12}
  /* Header wrapping is Tabulator's own job — `headerWordWrap: true` adds
     .tabulator-col-title-wrap, which sets white-space:normal on the title only.
     Do NOT put white-space:normal on .tabulator-header itself: the header relies
     on nowrap to lay its columns out in a single line and translate them
     horizontally in step with the body. Overriding it stops the header scrolling. */
  .tabulator .tabulator-col-title-wrap{line-height:1.25}
  /* Approver columns are narrow; shrink their labels rather than truncate them. */
  .tabulator .tabulator-col.approver .tabulator-col-title{
    font-size:11px;letter-spacing:-.01em;
  }
  /* Column show/hide panel */
  .colpanel{
    position:absolute;top:100%;right:0;z-index:50;background:#fff;border:1px solid #ccd1d6;
    border-radius:7px;box-shadow:0 6px 22px rgba(0,0,0,.16);padding:8px;
    max-height:min(60vh,460px);overflow:auto;min-width:230px;
  }
  .colpanel .row{display:flex;align-items:center;gap:7px;padding:3px 5px;font-size:13px;border-radius:4px}
  .colpanel .row:hover{background:#f2f4f6}
  .colpanel label{cursor:pointer;flex:1}
  .colpanel .grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
    color:#8a929b;padding:8px 5px 3px}
  .colpanel .acts{display:flex;gap:6px;padding:6px 4px 2px;border-top:1px solid #eee;margin-top:6px;flex-wrap:wrap}
  /* Pin-to-left toggle. Dimmed until it is on, so the pinned columns read at a glance. */
  .colpanel .pin{border:0;background:none;cursor:pointer;font-size:12px;line-height:1;padding:2px 3px;
    border-radius:4px;opacity:.22;filter:grayscale(1)}
  .colpanel .pin:hover{opacity:.6;background:#e8ebee}
  .colpanel .pin.on{opacity:1;filter:none;background:#e7f0ff}
  .colpanel .row{min-width:0}
  .colpanel label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* ── Row form: adding a person, a calling or a link ──────────────────── */
  /* A roster row is thirteen fields. A chain of thirteen prompt() boxes cannot be reviewed
     before it commits and cannot be corrected halfway, so adding a row gets a real form. */
  .modal{position:fixed;inset:0;z-index:200;background:rgba(20,24,28,.45);
    display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;overflow:auto}
  .modal .sheetform{background:#fff;border-radius:10px;box-shadow:0 12px 40px rgba(0,0,0,.28);
    width:min(560px,100%);padding:18px 20px 16px}
  .sheetform h2{margin:0 0 3px;font-size:16px}
  .sheetform .sub{margin:0 0 14px;font-size:12.5px;color:#777;line-height:1.45}
  .sheetform .fields{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
  .sheetform label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;color:#8a929b;min-width:0}
  .sheetform label.wide{grid-column:1/-1}
  .sheetform input,.sheetform select{font:inherit;font-size:13px;font-weight:400;text-transform:none;
    letter-spacing:0;color:#222;padding:6px 8px;border:1px solid #ccd1d6;border-radius:5px;
    width:100%;box-sizing:border-box}
  .sheetform input:focus,.sheetform select:focus{outline:2px solid #1a3a6b;outline-offset:-1px}
  .sheetform .req{color:#b3261e}
  .sheetform .hint{font-size:11px;font-weight:400;text-transform:none;letter-spacing:0;color:#999}
  .sheetform .err{margin:12px 0 0;padding:7px 10px;border-radius:6px;background:#fdecea;
    border:1px solid #f5c2bd;color:#8a1c12;font-size:12.5px}
  .sheetform .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px;
    padding-top:13px;border-top:1px solid #eee}
  .sheetform .acts button{font-size:13px;padding:7px 14px}
  .sheetform .acts .go{background:#1a3a6b;color:#fff;border-color:#1a3a6b;font-weight:600}
  .sheetform .acts .go:hover{background:#16305a}
  @media (max-width:560px){ .sheetform .fields{grid-template-columns:1fr} }
  /* The ✕ that removes a roster person or a stake link, in its own narrow column. */
  .rowdel{border:0;background:none;cursor:pointer;color:#b3261e;font-size:13px;line-height:1;
    padding:2px 5px;border-radius:4px;opacity:.3}
  .rowdel:hover{opacity:1;background:#fdecea}
  /* ── Action Items task browser ───────────────────────────────────────── */
  .tb{display:flex;flex-direction:column;height:100%;min-height:0}
  .tb-filters{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;padding:10px 14px;
    border-bottom:1px solid #e2e5e9;background:#fafbfc;flex:none}
  .tb-filters label{display:flex;flex-direction:column;gap:3px;font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.06em;color:#8a929b}
  .tb-filters label.grow{flex:1 1 220px}
  .tb-filters select,.tb-filters input{font:inherit;font-size:13px;font-weight:400;text-transform:none;
    letter-spacing:0;color:#222;padding:5px 7px;border:1px solid #ccd1d6;border-radius:5px;min-width:130px}
  .tb-filters .grow input{width:100%}
  .tb-filters button{font-size:12px;padding:6px 10px;border:1px solid #ccd1d6;background:#fff;
    border-radius:5px;cursor:pointer}
  .tb-body{display:flex;flex:1;min-height:0}
  .tb-list{flex:1 1 48%;overflow:auto;border-right:1px solid #e2e5e9;min-width:0}
  .tb-detail{flex:1 1 52%;overflow:auto;padding:14px 16px;min-width:0}
  .tb-row{padding:9px 14px;border-bottom:1px solid #f0f2f4;cursor:pointer}
  .tb-row:hover{background:#f6f8fa}
  .tb-row.sel{background:#e7f0ff;box-shadow:inset 3px 0 0 #1a3a6b}
  .tb-row-top{display:flex;gap:8px;align-items:baseline;font-size:11px}
  .tb-status{font-weight:700;text-transform:uppercase;letter-spacing:.05em}
  .tb-type{color:#8a929b}
  .tb-title{font-size:13.5px;margin:2px 0 1px;line-height:1.35}
  .tb-sub{font-size:11.5px;color:#777}
  .tb-empty{padding:18px;color:#888;font-size:13px}
  .tb-d-title{font-size:15px;font-weight:600;line-height:1.35;margin-bottom:10px}
  .tb-d-meta{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin-bottom:14px}
  .tb-f{display:contents}
  .tb-f span{color:#8a929b}
  .tb-f b{font-weight:600;word-break:break-word}
  .tb-lab{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
    color:#8a929b;margin-bottom:10px}
  .tb-lab select,.tb-lab input,.tb-lab textarea{display:block;width:100%;font:inherit;font-size:13px;
    font-weight:400;text-transform:none;letter-spacing:0;color:#222;margin-top:3px;padding:6px 8px;
    border:1px solid #ccd1d6;border-radius:5px;box-sizing:border-box}
  .tb-acts{display:flex;gap:8px;margin:4px 0 10px}
  .tb-del,.tb-restore{font-size:13px;padding:7px 12px;border-radius:5px;cursor:pointer;border:1px solid}
  .tb-del{border-color:#e6b4b4;background:#fff5f5;color:#b3261e}
  .tb-del:hover{background:#ffeaea}
  .tb-restore{border-color:#b7d7c0;background:#f2fbf5;color:#1a7a4c}
  .tb-people{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px;max-height:132px;overflow:auto;
    border:1px solid #e2e5e9;border-radius:6px;padding:6px;background:#fcfdfe}
  .tb-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:400;
    text-transform:none;letter-spacing:0;color:#444;border:1px solid #d7dbe0;border-radius:12px;
    padding:2px 9px 2px 6px;cursor:pointer;background:#fff;white-space:nowrap}
  .tb-chip.on{background:#e7f0ff;border-color:#9dbdf0;color:#1a3a6b;font-weight:600}
  .tb-chip input{margin:0}
  .tb-save{margin-top:7px;font-size:12.5px;padding:6px 11px;border:1px solid #9dbdf0;background:#e7f0ff;
    color:#1a3a6b;border-radius:5px;cursor:pointer;font-weight:600}
  .tb-save:hover{background:#d8e7ff}
  .tb-note{font-size:11.5px;color:#888;line-height:1.5;border-top:1px solid #eee;padding-top:8px}
  @media (max-width:820px){ .tb-body{flex-direction:column} .tb-list{border-right:0;border-bottom:1px solid #e2e5e9;max-height:45%} }
  .colwrap{position:relative}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:#666;padding:6px 16px;flex:none;background:#fff;border-bottom:1px solid #e2e5e9}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:4px;border:1px solid rgba(0,0,0,.15)}
  .toast{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:99;
    background:#222;color:#fff;padding:9px 16px;border-radius:7px;font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.show{opacity:1}
  .toast.err{background:#b3261e}
  .toast.warn{background:#8a5410}
  /* Conditional-formatting classes, applied per cell/row by the formatters below. */
  .cf-canceled{background:var(--cf-canceled)!important;color:#111!important}
  .cf-paused{background:var(--cf-paused)!important}
  .cf-declined{background:var(--cf-canceled)!important;color:#ddd!important}
  .tabulator-row.cf-canceled .tabulator-cell,
  .tabulator-row.cf-declined .tabulator-cell{background:var(--cf-canceled);color:#e8e8e8}
  .tabulator-row.cf-paused .tabulator-cell{background:var(--cf-paused)}
</style>
</head>
<body>

<header>
  <div class="titlebar">
    <h1>📋 Sheet Views <span class="who" id="who"></span></h1>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="banner" id="banner" hidden></div>

<div class="toolbar">
  <input type="text" id="search" placeholder="Search this table…" oninput="applyFilter()">
  <select id="statusFilter" onchange="applyFilter()" hidden></select>
  <span class="colwrap">
    <button onclick="toggleColPanel(event)" id="colBtn">⚙ Columns</button>
    <div class="colpanel" id="colPanel" hidden></div>
  </span>
  <button onclick="addRowClick()" id="addRowBtn" hidden>＋ Add row</button>
  <button onclick="reload()" id="reloadBtn">↻ Refresh</button>
  <span class="meta" id="meta"></span>
</div>

<div class="legend" id="legend"></div>

<div id="grid"></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// Sheet Views — a standalone window over the Supabase read views.
//
// Reads come straight from Supabase (~200-400ms). Every WRITE goes back through
// Apps Script, which updates the Google Sheet and mirrors the change into
// Supabase, so the sheet stays the system of record and the existing permission
// model still decides who may change what.
//
// The colours are not invented: they are the workbook's own conditional
// formatting rules, read out of the .xlsx and reimplemented here. See the
// COLOUR RULES section.
// ═══════════════════════════════════════════════════════════════════════════

const API_URL = 'https://script.google.com/macros/s/AKfycbz-8U9EqHl8nvJOypAvg0Q09Y6W6pShuJfvoaJda22LUqYPDZRRSytKZ4go5HERiyhr/exec';
const SUPABASE_URL = 'https://lrfbxbiwqnlctomjeboi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eJToH6uWrOBEPzhkzgA_Hg_VRn81dfP';

const qp = new URLSearchParams(location.search);
const USER_ID = qp.get('userId') || '';
const DEMO = qp.get('demo') || '';
const USER_NAME = qp.get('name') || '';

let grid = null, tab = 'callings';
const counts = {};

// ── helpers ───────────────────────────────────────────────────────────────
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const _d = c => { const v = c.getValue(); return v ? String(v).slice(0, 10) : ''; };
const daysUntil = v => {
  if (!v) return null;
  const d = new Date(v); if (isNaN(d)) return null;
  return Math.round((d - new Date().setHours(0,0,0,0)) / 86400000);
};

function toast(msg, kind) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = 'toast'; }, 3200);
}

async function sbSelect(view, query) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${view}?${query}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
  });
  if (!res.ok) throw new Error('Supabase ' + res.status + ': ' + (await res.text()).slice(0, 160));
  return res.json();
}

// ═══════════════════════════════════════════════════════════════════════════
// COLOUR RULES
//
// Taken verbatim from the workbook's conditionalFormatting XML. The sheet greys
// a checkbox out when that step does not apply to that calling — which is real
// information ("you do not need to tick this"), so it is reproduced here rather
// than dropped.
// ═══════════════════════════════════════════════════════════════════════════
const RX = {
  president:  /President/i,
  audit:      /Audit/i,
  secondary:  /Executive|Clerk|Bishopric/i,
  nameTag:    /Stake Executive|Stake Clerk|Stake Assistant|Bishopric|High Councilor|Relief/i,
  key:        /President|Bishop|High Councilor|Clerk|Executive/i,
};

/** Is this checkbox not applicable to this row's calling? Returns true to grey it. */
function notApplicable(field, row) {
  const calling = row.calling || '';
  const released = row.action === 'Released';
  switch (field) {
    // "Release Extended" only matters when somebody is actually being released.
    case 'release_extended':     return !row.releases && !released;
    // Counselors are only approved separately for presidencies.
    case 'counselors_approved':  return !RX.president.test(calling);
    case 'secondary_approval':   return released || !RX.secondary.test(calling);
    case 'marked_set_apart_lcr': return released || RX.audit.test(calling);
    case 'sustained':            return RX.audit.test(calling);
    case 'name_tag':             return !RX.nameTag.test(calling);
    case 'key_done':             return !RX.key.test(calling);
    case 'accepted':             return released;
    case 'set_apart':            return released;

    // ── Stake Business ──────────────────────────────────────────────────
    // Sheet rule on H2:H211 — Not(EQ(F2,"Release")) greys the fill to #B7B7B7.
    // "Released on LCR" only means anything on a release row.
    case 'lcr':                  return !/release/i.test(String(row.action || ''));

    // ── Priesthood Ordinations ──────────────────────────────────────────
    // Sheet rule on AG5:AQ37 — EQ($AF5,"") greys everything downstream of Date
    // Ordained until the ordination has actually happened.
    case 'recorded_on_lcr':
    case 'certificate_printed':
    case 'certificate_signed':
    case 'certificate_delivered':
      return row.ordained_at !== undefined && !String(row.ordained_at || '').trim();

    default: return false;
  }
}

/** The post-ordination text columns carry the same greying as the tick boxes above. */
function ordDetailFormatter(cell) {
  const row = cell.getRow().getData();
  const el = cell.getElement();
  const na = !String(row.ordained_at || '').trim();
  if (el) {
    el.style.background = na ? 'var(--cf-na-bg)' : '';
    el.style.color = na ? 'var(--cf-na-fg)' : '';
  }
  return esc(String(cell.getValue() ?? ''));
}

/** Tick boxes: blue when set, grey when the step does not apply to this calling. */
function tickFormatter(cell) {
  const row = cell.getRow().getData();
  const field = cell.getField();
  const on = cell.getValue() === true;
  const na = notApplicable(field, row);
  const el = cell.getElement();
  if (el) {
    el.style.background = na ? 'var(--cf-na-bg)' : (on ? 'var(--cf-ticked)' : '');
    el.style.color = na ? 'var(--cf-na-fg)' : '';
  }
  // A greyed box that is nonetheless ticked must still show its tick. The sheet greys
  // the background and leaves the checkmark visible; replacing it with a dash would
  // hide a real state. 9 rows in the live data are exactly this case — a release whose
  // "Accepted" box was ticked anyway.
  if (on) return '<span style="font-weight:700;color:' + (na ? '#4a4a4a' : '#1a3a6b') + '">✓</span>';
  if (na) return '<span style="opacity:.55">—</span>';
  return '<span style="opacity:.3">·</span>';
}

/** Member / calling: released rows go peach; text colour follows sustaining body. */
function nameFormatter(cell) {
  const row = cell.getRow().getData();
  const el = cell.getElement();
  if (el) {
    if (row.action === 'Released') {
      el.style.background = 'var(--cf-released-bg)';
      el.style.color = 'var(--cf-released-fg)';
    } else {
      el.style.background = '';
      el.style.color = row.sustaining_body === 'Stake' ? 'var(--cf-stake-fg)'
                     : row.sustaining_body === 'Ward'  ? 'var(--cf-ward-fg)' : '';
    }
  }
  return esc(cell.getValue() || '');
}

/** Stake business date: red and bold when it is within a week and not yet added. */
function sbDateFormatter(cell) {
  const row = cell.getRow().getData();
  const v = cell.getValue();
  const el = cell.getElement();
  const d = daysUntil(v);
  const due = d !== null && d >= 0 && d <= 7 && !row.added_to_stake_business;
  if (el) {
    el.style.background = due ? 'var(--cf-due-bg)' : '';
    el.style.color = due ? 'var(--cf-due-fg)' : '';
    el.style.fontWeight = due ? '700' : '';
  }
  return v ? String(v).slice(0, 10) : '';
}

/** Whole-row shading for canceled / paused / declined. */
function rowFormatter(row) {
  const d = row.getData();
  const el = row.getElement();
  el.classList.remove('cf-canceled', 'cf-paused', 'cf-declined');
  if (d.status === 'canceled') el.classList.add('cf-canceled');
  else if (d.status === 'paused') el.classList.add('cf-paused');
  else if (d.declined) el.classList.add('cf-declined');
}

// ── editing ───────────────────────────────────────────────────────────────
const STAKE_WARDS = ['16th Ward','19th Ward','24th Ward','25th Ward',
                     '27th Ward','32nd Ward','33rd Ward','49th Ward'];
const WARD_OTHER = '➕ Other unit…';

// The eight wards, plus an escape hatch for a member called from outside the
// stake. A unit typed that way is deliberately NOT added to the list — it
// belongs to that one row, not to the stake.
function wardEditor(cell, onRendered, success, cancel) {
  const cur = cell.getValue() || '';
  const sel = document.createElement('select');
  sel.style.cssText = 'width:100%;box-sizing:border-box;font-size:13px;padding:3px;';
  const opts = ['', ...STAKE_WARDS];
  if (cur && !STAKE_WARDS.includes(cur)) opts.push(cur);   // keep an existing outside unit selectable
  opts.push(WARD_OTHER);
  opts.forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v || '—';
    if (v === cur) o.selected = true;
    sel.appendChild(o);
  });
  const finish = () => {
    if (sel.value === WARD_OTHER) {
      const typed = (prompt('Unit name (a ward or stake outside ours):', '') || '').trim();
      if (!typed) { cancel(); return; }
      success(typed);
      return;
    }
    success(sel.value);
  };
  sel.addEventListener('change', finish);
  sel.addEventListener('blur', () => { if (sel.value !== WARD_OTHER) success(sel.value); });
  sel.addEventListener('keydown', e => { if (e.key === 'Escape') cancel(); });
  onRendered(() => sel.focus());
  return sel;
}

async function saveCell(cell, gridName, keyField) {
  const row = cell.getRow().getData();
  const field = cell.getField();
  const before = cell.getOldValue();
  const el = cell.getElement();

  if (DEMO) {
    toast('Demo — the change is not saved anywhere');
    return;
  }
  if (!USER_ID) {
    cell.setValue(before, true);
    toast('No user — reopen this window from the dashboard', 'err');
    return;
  }
  if (el) el.style.outline = '2px solid #f0b429';
  try {
    const params = new URLSearchParams({
      action: 'updateGridCell', userId: USER_ID, grid: gridName,
      rowKey: String(row[keyField] ?? ''), field: field,
      value: cell.getValue() === null || cell.getValue() === undefined ? '' : cell.getValue()
    });
    const res = await fetch(API_URL + '?' + params.toString());
    const data = await res.json();
    if (!data || data.success === false) throw new Error((data && data.error) || 'refused');
    if (el) {
      el.style.outline = '2px solid #4caf50';
      setTimeout(() => { el.style.outline = ''; }, 900);
    }
    if (data.mirrored && data.mirrored !== 'ok') {
      toast(data.mirrored === 'not-configured'
        ? 'Saved to the sheet. The Supabase mirror is not configured yet.'
        : 'Saved to the sheet, but the database mirror failed.', 'warn');
    }
  } catch (e) {
    cell.setValue(before, true);            // the sheet did not change; do not pretend it did
    if (el) el.style.outline = '';
    toast('Not saved: ' + (e.message || e), 'err');
  }
}

// A cell on a sheet-backed grid (roster, ordinations). Same route as the Supabase-backed
// grids — updateGridCell — but the row key comes from the sheet read, and `expect` guards a
// row-number key against somebody inserting a row since the grid loaded.
async function saveGridCell(cell, gridName) {
  const row = cell.getRow().getData();
  const field = cell.getField();
  const before = cell.getOldValue();
  const el = cell.getElement();

  if (DEMO) { toast('Demo — the change is not saved anywhere'); return; }

    cell.setValue(before, true);
    toast('No user — reopen this window from the dashboard', 'err');
    return;
  }
  if (el) el.style.outline = '2px solid #f0b429';
  try {

      action: 'updateGridCell', userId: USER_ID, grid: gridName,

  } catch (e) {
    cell.setValue(before, true);          // the sheet did not change; do not pretend it did
    if (el) el.style.outline = '';
    toast('Not saved: ' + (e.message || e), 'err');
  }
}

// once per burst of edits.
let _regroupTimer = null;
function scheduleRegroup() {
  clearTimeout(_regroupTimer);
  _regroupTimer = setTimeout(() => { load(); }, 1200);
}

// fetch + JSON with the same transient-404 retry the dashboard uses: Apps Script intermittently
// answers /exec with its own "Page Not Found" for routes that exist.
async function apiJson(url) {
  let attempt = 0;
  for (;;) {
    const r = await fetch(url);
    if (r.ok) return r.json();
    const transient = r.status === 404 || r.status >= 500;
    if (!transient || attempt >= 2) throw new Error('HTTP ' + r.status);
    attempt++;
    await new Promise(res => setTimeout(res, 400 * attempt));
  }
}

function ed(col, gridName, keyField, editor, params) {
  return Object.assign({}, col, {
    editor: editor || 'input',
    editorParams: params || {},
    cellEdited: cell => saveCell(cell, gridName, keyField),
  });
}

// ── column visibility ─────────────────────────────────────────────────────
// Which columns are hidden is remembered per table, in this browser. Widths are
// remembered too, so a clerk who narrows a column keeps it narrow.
const LS_HIDDEN = 'sheetviews_hidden_v1';
const LS_WIDTHS = 'sheetviews_widths_v1';
// Which columns are pinned to the left. Tabulator freezes from the left edge inwards, so the
// frozen set is applied in the table's own column order rather than the order they were picked.
const LS_FROZEN = 'sheetviews_frozen_v1';

function readLS(key) {
  try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { return {}; }
}
function writeLS(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}
const hiddenFor = t => (readLS(LS_HIDDEN)[t] || []);
function setHidden(t, list) {
  const all = readLS(LS_HIDDEN); all[t] = list; writeLS(LS_HIDDEN, all);
}
// null = "this table has never been customised", so the column defaults (frozen: true on the
// name column, say) still apply. An empty ARRAY means the user deliberately unpinned everything.
const frozenFor = t => {
  const v = readLS(LS_FROZEN)[t];
  return Array.isArray(v) ? v : null;
};
function setFrozen(t, list) {
  const all = readLS(LS_FROZEN); all[t] = list; writeLS(LS_FROZEN, all);
}

function rememberWidth(field, w) {
  const all = readLS(LS_WIDTHS);
  (all[tab] = all[tab] || {})[field] = w;
  writeLS(LS_WIDTHS, all);
}

function toggleColPanel(ev) {
  if (ev) ev.stopPropagation();
  const panel = document.getElementById('colPanel');
  if (!panel.hidden) { panel.hidden = true; return; }
  renderColPanel();
  panel.hidden = false;
}
document.addEventListener('click', e => {
  const panel = document.getElementById('colPanel');
  if (!panel || panel.hidden) return;
  if (!panel.contains(e.target) && e.target.id !== 'colBtn') panel.hidden = true;
});

function renderColPanel() {
  const panel = document.getElementById('colPanel');
  if (!grid || !TABS[tab].cols) { panel.innerHTML = '<div class="row">Nothing loaded yet</div>'; return; }
  const hidden = new Set(hiddenFor(tab));
  const cols = TABS[tab].cols;
  const isApprover = f => String(f || '').startsWith('vote_');
  // The ✕ column has no title and is the only way to remove a row — it is not a column the
  // user hides or pins, so it stays out of the panel entirely.
  const groups = [
    ['Columns', cols.filter(c => c.field && c.field !== '_del' && !isApprover(c.field))],
    ['Approvers', cols.filter(c => isApprover(c.field))],
  ].filter(g => g[1].length);

  const frozenList = frozenFor(tab);
  const frozen = new Set(frozenList === null
    ? cols.filter(c => c.frozen).map(c => c.field)
    : frozenList);

  panel.innerHTML =
    '<div class="grp">Show · Pin left</div>'
    + groups.map(([label, list]) =>
    (label === 'Columns' ? '' : `<div class="grp">${label}</div>`) + list.map(c => {
      const on = !hidden.has(c.field);
      const pinned = frozen.has(c.field);
      return `<div class="row">
        <input type="checkbox" id="cb_${esc(c.field)}" ${on ? 'checked' : ''}
               onchange="setColVisible('${esc(c.field)}', this.checked)">
        <label for="cb_${esc(c.field)}">${esc(String(c.title))}</label>
        <button class="pin${pinned ? ' on' : ''}" title="${pinned ? 'Unpin from the left' : 'Pin to the left'}"
                onclick="toggleFrozen('${esc(c.field)}')">📌</button>
      </div>`;
    }).join('')).join('')
    + `<div class="acts">
         <button onclick="showAllCols()">Show all</button>
         <button onclick="hideApprovers()">Hide approvers</button>
         <button onclick="resetCols()">Reset</button>
       </div>`;
}

function setColVisible(field, visible) {
  const hidden = new Set(hiddenFor(tab));
  if (visible) hidden.delete(field); else hidden.add(field);
  setHidden(tab, [...hidden]);
  if (!grid) return;
  try { visible ? grid.showColumn(field) : grid.hideColumn(field); } catch (e) {}
}

// Pinning changes the column definition, which Tabulator only reads when the table is built —
// so this reloads. Cheap for these table sizes and far simpler than rebuilding columns in place.
function toggleFrozen(field) {
  const cols = TABS[tab].cols;
  if (!cols) return;
  const cur = frozenFor(tab);
  const set = new Set(cur === null ? cols.filter(c => c.frozen).map(c => c.field) : cur);
  if (set.has(field)) set.delete(field); else set.add(field);
  setFrozen(tab, [...set]);
  load();
}

function showAllCols() {
  setHidden(tab, []);
  if (grid && TABS[tab].cols) TABS[tab].cols.forEach(c => { try { grid.showColumn(c.field); } catch (e) {} });
  renderColPanel();
}

// Back to how the table ships: nothing hidden, default pins, default widths.
function resetCols() {
  setHidden(tab, []);
  const f = readLS(LS_FROZEN); delete f[tab]; writeLS(LS_FROZEN, f);
  const w = readLS(LS_WIDTHS); delete w[tab]; writeLS(LS_WIDTHS, w);
  load();
}

function hideApprovers() {
  if (!TABS[tab].cols) return;
  const list = TABS[tab].cols.map(c => c.field).filter(f => String(f || '').startsWith('vote_'));
  const hidden = new Set(hiddenFor(tab));
  list.forEach(f => hidden.add(f));
  setHidden(tab, [...hidden]);
  if (grid) list.forEach(f => { try { grid.hideColumn(f); } catch (e) {} });
  renderColPanel();
}

// ── shell ─────────────────────────────────────────────────────────────────
function renderTabs() {
  document.getElementById('tabs').innerHTML = Object.keys(TABS).map(k =>
    `<button class="tab${k === tab ? ' active' : ''}" onclick="switchTab('${k}')">`
    + TABS[k].label
    + (counts[k] != null ? `<span class="n">${counts[k]}</span>` : '')
    + '</button>').join('');
}

function renderLegend() {
  const items = tab === 'callings' ? [
    ['var(--cf-released-bg)', 'a release'],
    ['transparent', '<span style="color:var(--cf-stake-fg);font-weight:700">stake</span> / '
      + '<span style="color:var(--cf-ward-fg);font-weight:700">ward</span> sustaining'],
    ['var(--cf-ticked)', 'done'],
    ['var(--cf-na-bg)', 'not needed for this calling'],
    ['var(--cf-due-bg)', 'stake business within a week, not yet added'],
    ['var(--cf-allapproved)', 'everyone has approved'],
    ['var(--cf-canceled)', 'canceled / declined'],
    ['var(--cf-paused)', 'paused'],
  ] : [];
  const el = document.getElementById('legend');
  el.hidden = !items.length;
  el.innerHTML = items.map(([c, l]) =>
    (c === 'transparent' ? '' : `<i style="background:${c}"></i>`) + l).join('');
}

function switchTab(k) {
  if (k === tab) return;
  tab = k;
  document.getElementById('search').value = '';
  renderTabs(); renderLegend(); load();
}

function applyFilter() {
  if (!grid) return;
  const q = (document.getElementById('search').value || '').toLowerCase();
  const st = document.getElementById('statusFilter').value || '';
  if (!q && !st) { grid.clearFilter(); return; }
  grid.setFilter(row => {
    if (st && row.status !== st) return false;
    if (!q) return true;
    return Object.values(row).some(v => v != null && String(v).toLowerCase().includes(q));
  });
}

async function load() {
  const spec = TABS[tab];
  const box = document.getElementById('grid');
  const t0 = Date.now();
  if (grid) { try { grid.destroy(); } catch (e) {} grid = null; }
  box.innerHTML = '<p style="padding:16px;color:#777;font-size:13px">Loading…</p>';

  // A tab that is not a table renders itself and returns. This has to come BEFORE anything
  // that touches spec.cols — the task browser has no columns, and reading .includes() off
  // undefined threw before the tab ever drew anything.
  if (spec.custom === 'tasks') {
    document.getElementById('statusFilter').hidden = true;
    const addBtn = document.getElementById('addRowBtn');
    if (addBtn) addBtn.hidden = true;
    document.getElementById('colBtn').hidden = true;
    await loadTaskBrowser(box, t0);
    return;
  }
  document.getElementById('colBtn').hidden = false;

  if ((tab === 'callings' || tab === 'ordinations') && !APPROVERS.length) await loadApprovers();
  // The approver columns depend on the roster, which is fetched — splice them in
  // at the placeholder now that it is known.
  if (spec.cols.includes('@APPROVERS@')) {
    const i = spec.cols.indexOf('@APPROVERS@');
    spec.cols.splice(i, 1, ...approverColumns());
  }

  // status dropdown, per table
  const addBtn = document.getElementById('addRowBtn');
  if (addBtn) {
    addBtn.hidden = !spec.addRow;
    if (spec.addRow) addBtn.textContent = spec.addRow.label;
  }

  const sf = document.getElementById('statusFilter');
  sf.hidden = !spec.statuses;
  if (spec.statuses) {
    sf.innerHTML = '<option value="">All statuses</option>'
      + spec.statuses.map(s => `<option value="${s}">${s}</option>`).join('');
  }

  try {
    // A tab with `api` reads through Apps Script instead of Supabase — Stake Business needs the
    // sheet's Row ID and a computed `sustained` flag, neither of which the Supabase view has.
    let rows, today = '';
    if (DEMO) {
      rows = demoRows(tab);
      today = new Date().toISOString().slice(0, 10);
    } else if (spec.api) {
      const d = await apiJson(API_URL + '?action=' + spec.api
        + '&userId=' + encodeURIComponent(USER_ID || '')
        + (spec.apiGrid ? '&grid=' + encodeURIComponent(spec.apiGrid) : ''));
      if (!d || d.success === false) throw new Error((d && d.error) || 'refused');
      rows = d.rows || [];
      today = d.today || new Date().toISOString().slice(0, 10);
    } else {
      rows = await sbSelect(spec.view, 'select=*&order=' + spec.order);
    }
    if (spec.decorate) spec.decorate(rows, today);
    if (spec.sort) rows.sort(spec.sort);
    const ms = Date.now() - t0;
    box.innerHTML = '';
    const hidden = new Set(hiddenFor(tab));
    const savedWidths = (readLS(LS_WIDTHS)[tab]) || {};
    const frozenSaved = frozenFor(tab);
    const frozenSet = frozenSaved === null ? null : new Set(frozenSaved);
    const cols = spec.cols.map(c => Object.assign({}, c, {
      visible: !hidden.has(c.field),
      // null → keep whatever the column definition says; a saved list wins outright.
      frozen: frozenSet === null ? !!c.frozen : frozenSet.has(c.field),
      width: savedWidths[c.field] || c.width,
      // Every header gets its full text on hover, so a narrowed column is still readable.
      headerTooltip: c.headerTooltip || String(c.title),
      headerWordWrap: true,
    }));
    grid = new Tabulator(box, {
      data: rows, layout: 'fitDataStretch', height: '100%',
      placeholder: 'Nothing here', columns: cols,
      rowFormatter: spec.rowFormatter || undefined,
      movableColumns: true,
      columnDefaults: { resizable: true, headerWordWrap: true },
      groupBy: spec.groupBy || undefined,
      groupHeader: spec.groupHeader || undefined,
      // Everything still to happen opens; the settled history stays folded away.
      groupStartOpen: spec.groupStartOpen
        || (g => String(g).indexOf('Reported') === -1),
    });
    grid.on('columnResized', col => {
      try { rememberWidth(col.getField(), col.getWidth()); } catch (e) {}
    });
    counts[tab] = rows.length;
    renderTabs();
    if (!document.getElementById('colPanel').hidden) renderColPanel();
    document.getElementById('meta').textContent = DEMO
      ? rows.length + ' sample rows'
      : rows.length + ' rows · ' + ms + 'ms';
  } catch (e) {
    box.innerHTML = '<p style="padding:16px;color:#b3261e;font-size:13px">Could not load: '
      + esc(e.message || e) + '</p>';
  }
}

// Add a row straight to the Stake Business sheet. This bypasses the approval pipeline — there
// is no Calling Approvals row behind it — so it asks first and says so plainly. It is for
// corrections and genuine one-offs; the recommendation form is the normal route.
async function addBusinessRow() {
  if (DEMO) { toast('Demo — nothing is saved'); return; }
  if (!USER_ID) { toast('No user — reopen this window from the dashboard', 'err'); return; }

  const member = prompt('Who is this for?  (full name)');
  if (!member) return;
  const calling = prompt('Which calling?');
  if (!calling) return;
  const action = prompt('Action — Sustain, Release, Ordain, or Sustain & Ordain', 'Sustain');
  if (!action) return;
  const ward = prompt('Ward  (blank for a stake-wide item)', '') || '';
  const where = (prompt('Read in one ward or every ward?  Ward / Stake / None',
                        ward ? 'Ward' : 'Stake') || 'Ward');
  const date = prompt('Stake business date  (yyyy-mm-dd, blank = the next one)', '') || '';

  if (!confirm(
      'Add ' + member + ' — ' + calling + ' (' + action + ')?\n\n'
    + 'This goes straight onto the Sunday agenda and does NOT go through the approval '
    + 'pipeline, so there will be no Calling Approvals row behind it.')) return;

  const btn = document.getElementById('addRowBtn');
  if (btn) { btn.disabled = true; btn.textContent = 'Adding…'; }
  try {
    // `action` is the route; the row's own action travels as `rowAction`.
    const params = new URLSearchParams({
      action: 'sbAddRow', userId: USER_ID,
      member: member, calling: calling, rowAction: action,

    toast('Not added: ' + (e.message || e), 'err');
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = '＋ Add row'; }
  }
}

// ── Adding and removing rows ──────────────────────────────────────────────
// Three routes do all of this: gridAddRow, gridDeleteRow and settingsLink. The form below is
// generic — each grid supplies a field list and the fixed params its route needs.
//
// Why a form and not a chain of prompt() boxes: a roster person is thirteen fields. Thirteen
// prompts cannot be reviewed before they commit and cannot be corrected halfway through, and
// the roster is the sheet most bugs have traced back to. Stake Business keeps its prompts —
// it asks four questions and carries a warning that wants reading on its own.

// A field: { f, label, hint, req, wide, values, list }
//   values → a fixed <select>;  list → suggestions drawn from the rows already loaded, so
//   the options are whatever the sheet actually uses rather than something guessed here.
const ROW_FORMS = {
  roster: {
    title: 'Add someone to the roster',
    sub: 'This appends a row to <b>Stake Callings</b>. Only the calling is required — anything '
       + 'left blank can be filled in on the grid afterwards. A Slack ID is what puts the '
       + 'dashboard in front of them, so it is worth having.',
    route: { action: 'gridAddRow', grid: 'roster' },
    fields: [
      { f: 'calling', label: 'Calling', req: true, wide: true, list: true,
        hint: 'Exactly as it is written on the Callings Chart' },
      { f: 'name', label: 'First & last name' },
      { f: 'title_name', label: 'Title name', hint: 'e.g. Bishop Powelson' },
      { f: 'slack_id', label: 'Slack user ID', hint: 'Starts with U' },
      { f: 'ward', label: 'Ward', list: true, hint: 'Needs a number, e.g. 25th Ward' },
      { f: 'email', label: 'Email' },
      { f: 'phone', label: 'Phone' },
      { f: 'first_responsibility', label: 'First responsibility', list: true },
      { f: 'second_responsibility', label: 'Second responsibility', list: true },
      { f: 'presidency', label: 'Presidency', list: true },
      { f: 'supervisor', label: 'Supervisor Slack ID' },
      { f: 'primary_pref', label: 'Primary notifications',
        values: ['', 'Immediately', 'Hourly', 'Daily', 'None'] },
      { f: 'cc_pref', label: "CC'd notifications",
        values: ['', 'Immediately', 'Hourly', 'Daily', 'None'] },
    ],
  },
  chart: {
    title: 'Add a calling to the chart',
    sub: 'The <b>Callings Chart</b> is what tells the pipeline who approves a calling, who '
       + 'extends it and who sets it apart. A calling missing from it routes to the bin with '
       + 'no requirements, so the routing fields are worth setting now. Every other column — '
       + 'the temple-recommend and priesthood ticks, the notes — is editable on the grid.',
    route: { action: 'gridAddRow', grid: 'chart' },
    fields: [
      { f: 'calling', label: 'Calling', req: true, wide: true,
        hint: 'Must be unique — this name is the key every other sheet refers to' },
      { f: 'approval_level', label: 'Approval level', list: true },
      { f: 'sustaining_body', label: 'Sustaining body', list: true },
      { f: 'recommended_by', label: 'Recommended by', list: true },
      { f: 'approved_by', label: 'Approved by', list: true },
      { f: 'extend_routing', label: 'Extended by', list: true },
      { f: 'set_apart_routing', label: 'Set apart by', list: true },
      { f: 'conducts_sustaining', label: 'Conducts sustaining', list: true },
      { f: 'can_be_submitted_by', label: 'Can be submitted by', list: true },
      { f: 'sustaining_title', label: 'Sustaining title', wide: true,
        hint: 'How it is read aloud, if that differs from the calling name' },
    ],
  },
  link: {
    title: 'Add a stake link',
    sub: 'Links appear on everyone&rsquo;s dashboard. This fills the first free row in the '
       + 'links block (column C/D of <b>Settings</b>) and never moves the settings beside it.',
    route: { action: 'settingsLink', mode: 'add' },
    fields: [
      { f: 'label', label: 'Link name', req: true, wide: true, hint: 'What the button says' },
      { f: 'url', label: 'URL', req: true, wide: true, hint: 'Must start with http:// or https://' },
    ],
  },
};

let formKey = null;

/** The toolbar's add button. Each tab says what it adds; Stake Business runs its own flow. */
function addRowClick() {
  const spec = TABS[tab];
  if (spec && spec.addRow && spec.addRow.run) spec.addRow.run();
}

/** Distinct non-empty values for a field among the rows currently loaded. */
function suggestionsFor(field) {
  if (!grid) return [];
  const seen = new Set();
  try {
    grid.getData().forEach(r => {
      const v = String(r[field] == null ? '' : r[field]).trim();
      if (v) seen.add(v);
    });
  } catch (e) { return []; }
  return [...seen].sort((a, b) => a.localeCompare(b)).slice(0, 300);
}

function openRowForm(key) {
  if (DEMO) { toast('Demo — nothing is saved'); return; }
  if (!USER_ID) { toast('No user — reopen this window from the dashboard', 'err'); return; }
  const spec = ROW_FORMS[key];
  if (!spec) return;
  formKey = key;

  const body = spec.fields.map(fl => {
    const id = 'ff_' + fl.f;
    let input;
    if (fl.values) {
      input = `<select id="${id}">` + fl.values.map(v =>
        `<option value="${esc(v)}">${esc(v || '—')}</option>`).join('') + '</select>';
    } else if (fl.list) {
      const opts = suggestionsFor(fl.f);
      input = `<input type="text" id="${id}" list="dl_${fl.f}" autocomplete="off">`
        + `<datalist id="dl_${fl.f}">`
        + opts.map(v => `<option value="${esc(v)}"></option>`).join('') + '</datalist>';
    } else {
      input = `<input type="text" id="${id}" autocomplete="off">`;
    }
    return `<label class="${fl.wide ? 'wide' : ''}">`
      + esc(fl.label) + (fl.req ? ' <span class="req">*</span>' : '')
      + input
      + (fl.hint ? `<span class="hint">${fl.hint}</span>` : '')
      + '</label>';
  }).join('');

  const wrap = document.createElement('div');
  wrap.className = 'modal';
  wrap.id = 'rowFormModal';
  wrap.innerHTML = `<div class="sheetform" role="dialog" aria-modal="true" aria-label="${esc(spec.title)}">
      <h2>${esc(spec.title)}</h2>
      <p class="sub">${spec.sub}</p>
      <div class="fields">${body}</div>
      <p class="err" id="formErr" hidden></p>
      <div class="acts">
        <button type="button" onclick="closeRowForm()">Cancel</button>
        <button type="button" class="go" id="formGo" onclick="submitRowForm()">Add</button>
      </div>
    </div>`;
  // A click on the backdrop closes; a click inside must not.
  wrap.addEventListener('mousedown', e => { if (e.target === wrap) closeRowForm(); });
  document.body.appendChild(wrap);
  const first = wrap.querySelector('input,select');
  if (first) first.focus();
  // Enter submits from any single-line field; Escape backs out.
  wrap.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.preventDefault(); closeRowForm(); }
    else if (e.key === 'Enter' && e.target.tagName === 'INPUT') { e.preventDefault(); submitRowForm(); }
  });
}

function closeRowForm() {
  const m = document.getElementById('rowFormModal');
  if (m) m.remove();
  formKey = null;
}

async function submitRowForm() {
  const spec = ROW_FORMS[formKey];
  if (!spec) return;
  const errBox = document.getElementById('formErr');
  const show = msg => { errBox.hidden = false; errBox.textContent = msg; };

  const params = new URLSearchParams(Object.assign({ userId: USER_ID }, spec.route));
  for (const fl of spec.fields) {
    const el = document.getElementById('ff_' + fl.f);
    const v = String((el && el.value) || '').trim();
    if (fl.req && !v) { show(fl.label + ' is required.'); if (el) el.focus(); return; }
    if (v) params.set(fl.f, v);
  }

  const go = document.getElementById('formGo');
  go.disabled = true; go.textContent = 'Adding…';
  errBox.hidden = true;
  try {
    const d = await apiJson(API_URL + '?' + params.toString());
    // The backend validates too (unique calling name, Slack ID shape, ward number, URL
    // scheme). Its refusal is the useful message, so it goes in the form rather than a toast
    // that disappears — the typed values are still on screen to correct.
    if (!d || d.success === false) throw new Error((d && d.error) || 'refused');
    closeRowForm();
    toast('Added');
    load();
  } catch (e) {
    show(e.message || String(e));
    go.disabled = false; go.textContent = 'Add';
  }
}

/**
 * Remove a roster row.
 *
 * `expect` is the calling as the grid last saw it, and the backend refuses if the sheet no
 * longer agrees. The key is a row NUMBER, so a row inserted on the sheet since this grid
 * loaded would otherwise mean deleting whoever sits there now.
 */
async function deleteGridRowAt(gridName, key, expect, note, prompt_) {
  if (DEMO) { toast('Demo — nothing is saved'); return; }
  if (!confirm(prompt_ + '\n\n' + expect + (note ? '\n' + note : ''))) return;
  try {
    const d = await apiJson(API_URL + '?' + new URLSearchParams({
      action: 'gridDeleteRow', userId: USER_ID || '',
      grid: gridName, rowKey: String(key), expect: String(expect)
    }).toString());
    if (!d || d.success === false) throw new Error((d && d.error) || 'refused');
    toast('Removed');
    load();
  } catch (e) {
    toast('Not removed: ' + (e.message || e), 'err');
  }
}

/**
 * Remove a roster person. `expect` is the calling as the grid last saw it; the backend refuses
 * if the sheet no longer agrees, because the key is a row NUMBER and a row inserted since this
 * grid loaded would otherwise mean deleting whoever sits there now.
 */
function deleteRosterRow(key, expect, who) {
  return deleteGridRowAt('roster', key, expect, who,
    'Remove this row from Stake Callings?\n\nThis deletes the row on the sheet. '
    + 'Their action items and history stay.');
}

/**
 * Remove a calling from the chart. The backend refuses while anything still refers to the
 * name — a live request or someone holding it — because every lookup is by name and a missing
 * chart row routes to the bin with no requirements.
 */
function deleteChartRow(row, calling) {
  return deleteGridRowAt('chart', row, calling, '',
    'Remove this calling from the Callings Chart?\n\nThis is refused if any request or any '
    + 'person on the roster still refers to it.');
}

/** Remove a stake link. Clears C/D on that row only — the setting beside it stays put. */
async function removeSettingsLink(row, label) {
  if (DEMO) { toast('Demo — nothing is saved'); return; }
  if (!confirm('Remove the "' + label + '" link from everyone’s dashboard?')) return;
  try {
    const d = await apiJson(API_URL + '?' + new URLSearchParams({
      action: 'settingsLink', userId: USER_ID || '',
      mode: 'remove', row: String(row), expect: String(label)
    }).toString());
    if (!d || d.success === false) throw new Error((d && d.error) || 'refused');
    toast('Link removed');
    load();
  } catch (e) {
    toast('Not removed: ' + (e.message || e), 'err');
  }
}

/** The ✕ column. `kind` is 'roster' or 'link'; a row that cannot be removed shows nothing. */
function delColumn(kind) {
  return {
    title: '', field: '_del', width: 34, hozAlign: 'center', headerSort: false,
    frozen: true, resizable: false, download: false,
    formatter: c => {
      const r = c.getData();
      if (kind === 'link' && !String(r.link_label || '').trim()) return '';
      if (kind !== 'link' && !String(r.calling || '').trim()) return '';
      return '<button class="rowdel" title="Remove this row" aria-label="Remove this row">✕</button>';
    },
    cellClick: (e, c) => {
      if (!e.target.classList.contains('rowdel')) return;
      const r = c.getData();
      const calling = String(r.calling || '').trim();
      // The chart is keyed by name, so its _key is that name — the sheet row is in _row.
      if (kind === 'link') removeSettingsLink(r._row, String(r.link_label || '').trim());
      else if (kind === 'chart') deleteChartRow(r._row, calling);
      else deleteRosterRow(r._key, calling, String(r.name || '').trim());
    },
  };
}

// ── Action Items: the clerk task browser ──────────────────────────────────
// A task is a GROUP (one primary row + a CC row per person, sharing a baseId), so everything
// here — edit, complete, delete — acts on the group. Editing one row is how a task ends up
// half-done, showing as complete for one person and open for another.
let TASKS = { groups: [], people: [], types: [], statuses: [] };
let taskFilters = { assignee: '', type: '', status: '', q: '' };
let selectedTask = null;

async function loadTaskBrowser(box, t0) {
  try {
    const qs = new URLSearchParams({ action: 'aiAdmin', userId: USER_ID || '' });
    Object.keys(taskFilters).forEach(k => { if (taskFilters[k]) qs.set(k, taskFilters[k]); });
    const d = await apiJson(API_URL + '?' + qs.toString());
    if (!d || d.success === false) throw new Error((d && d.error) || 'refused');
    TASKS = d;
    box.innerHTML = renderTaskBrowser(d);
    counts[tab] = d.total;
    renderTabs();
    document.getElementById('meta').textContent =
      d.total + ' task' + (d.total === 1 ? '' : 's') + ' · ' + (Date.now() - t0) + 'ms';
  } catch (e) {
    box.innerHTML = '<p style="padding:16px;color:#b3261e;font-size:13px">Could not load: '
      + esc(e.message || e) + '</p>';
  }
}

function renderTaskBrowser(d) {
  const opt = (list, cur) => ['<option value=""></option>']
    .concat(list.map(v => '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(v) + '</option>'))
    .join('');
  return `
  <div class="tb">
    <div class="tb-filters">
      <label>Person
        <select onchange="setTaskFilter('assignee', this.value)">${opt(d.people, taskFilters.assignee)}</select>
      </label>
      <label>Type
        <select onchange="setTaskFilter('type', this.value)">${opt(d.types, taskFilters.type)}</select>
      </label>
      <label>Status
        <select onchange="setTaskFilter('status', this.value)">${opt(d.statuses, taskFilters.status)}</select>
      </label>
      <label class="grow">Search
        <input type="search" value="${esc(taskFilters.q)}" placeholder="name, calling, notes…"
               onchange="setTaskFilter('q', this.value)">
      </label>
      <button onclick="clearTaskFilters()">Clear</button>
    </div>
    <div class="tb-body">
      <div class="tb-list">${d.groups.map(renderTaskRow).join('') || '<div class="tb-empty">Nothing matches.</div>'}</div>
      <div class="tb-detail" id="taskDetail">${selectedTask ? renderTaskDetail(selectedTask) : '<div class="tb-empty">Pick a task on the left.</div>'}</div>
    </div>
  </div>`;
}

const TASK_TONE = { Open: '#b26500', Completed: '#2e7d32', Deleted: '#b3261e', mixed: '#b3261e' };

function renderTaskRow(g) {
  const p = g.primary || {};
  const sel = selectedTask && selectedTask.baseId === g.baseId;
  return `<div class="tb-row${sel ? ' sel' : ''}" onclick="selectTask('${esc(g.baseId)}')">
    <div class="tb-row-top">
      <span class="tb-status" style="color:${TASK_TONE[g.status] || '#777'}">${esc(g.status)}</span>
      <span class="tb-type">${esc(g.actionType)}</span>
    </div>
    <div class="tb-title">${esc(g.displayText || '(no description)')}</div>
    <div class="tb-sub">${esc(p.name || 'unassigned')}${g.ccs.length ? ' + ' + g.ccs.length + ' CC' : ''}
      · ${esc(g.created)}${g.dueDate ? ' · due ' + esc(g.dueDate) : ''}</div>

function renderTaskDetail(g) {
  const p = g.primary || {};
  const row = (k, v) => v ? `<div class="tb-f"><span>${esc(k)}</span><b>${esc(v)}</b></div>` : '';

  return `
    <div class="tb-d-title">${esc(g.displayText || '(no description)')}</div>

      ${row('Type', g.actionType)}
      ${row('Status', g.status)}
      ${row('Assigned to', (g.primaries || []).map(x => x.name).filter(Boolean).join(', '))}
      ${g.ccs.length ? row('CC', g.ccs.map(c => c.name).filter(Boolean).join(', ')) : ''}
      ${row('Created', g.created)}
      ${row('Created by', g.createdByName || g.createdBy)}
      ${row('Reference', g.referenceId)}
      ${row('Completed', g.completedDate)}
      ${row('Completed by', g.completedBy)}

          const on = g.ccs.some(c => c.id === p.id);
          return `<label class="tb-chip${on ? ' on' : ''}"><input type="checkbox" value="${esc(p.id)}" ${on ? 'checked' : ''}
                    onchange="this.closest('label').classList.toggle('on', this.checked)"> ${esc(p.name)}</label>`;
        }).join('')}
      </div>
      <button class="tb-save" onclick="saveAssignees('${esc(g.baseId)}')">Save who it's assigned to</button>
    </div>
    <label class="tb-lab">Status
      <select onchange="saveTask('${esc(g.baseId)}','status',this.value)">
        ${TASKS.statuses.map(v => '<option' + (v === g.status ? ' selected' : '') + '>' + esc(v) + '</option>').join('')}
      </select>
    </label>
    <label class="tb-lab">Due date
      <input type="date" value="${esc((g.dueDate || '').slice(0, 10))}"
             onchange="saveTask('${esc(g.baseId)}','dueDate',this.value)">
    </label>
    <label class="tb-lab">Notes
      <textarea rows="4" onchange="saveTask('${esc(g.baseId)}','notes',this.value)">${esc(g.notes || '')}</textarea>
    </label>
    <div class="tb-acts">
      ${isDeleted
        ? `<button class="tb-restore" onclick="deleteTask('${esc(g.baseId)}', true)">↺ Restore</button>`
        : `<button class="tb-del" onclick="deleteTask('${esc(g.baseId)}', false)">🗑 Delete task</button>`}
    </div>
    <div class="tb-note">Every change applies to all ${g.rowCount} row${g.rowCount === 1 ? '' : 's'} of this task, so the person assigned and everyone CC'd stay in step. Deleting is recoverable — the rows are kept and hidden.</div>`;
}

function selectTask(baseId) {
  selectedTask = TASKS.groups.find(g => g.baseId === baseId) || null;
  document.getElementById('taskDetail').innerHTML =
    selectedTask ? renderTaskDetail(selectedTask) : '';
  document.querySelectorAll('.tb-row').forEach(el => el.classList.remove('sel'));
  const rows = [...document.querySelectorAll('.tb-row')];
  const idx = TASKS.groups.findIndex(g => g.baseId === baseId);
  if (rows[idx]) rows[idx].classList.add('sel');
}

function setTaskFilter(k, v) { taskFilters[k] = v; selectedTask = null; load(); }
function clearTaskFilters() { taskFilters = { assignee: '', type: '', status: '', q: '' }; selectedTask = null; load(); }

async function saveTask(baseId, field, value) {
  if (DEMO) { toast('Demo — nothing is saved'); return; }
  if (!USER_ID) { toast('No user — reopen from the dashboard', 'err'); return; }
  try {
    const d = await apiJson(API_URL + '?' + new URLSearchParams({
      action: 'aiUpdate', userId: USER_ID, baseId, field, value: value == null ? '' : value
    }).toString());
    if (!d || d.success === false) throw new Error((d && d.error) || 'refused');
    toast('Saved to ' + d.rows + ' row' + (d.rows === 1 ? '' : 's'));
    load();
  } catch (e) {
    toast('Not saved: ' + (e.message || e), 'err');
  }
}

async function saveAssignees(baseId) {
  if (DEMO) { toast('Demo — nothing is saved'); return; }
  if (!USER_ID) { toast('No user — reopen from the dashboard', 'err'); return; }
  const picked = id => [...document.querySelectorAll('#' + id + ' input:checked')].map(i => i.value);
  const primaryIds = picked('tbPri_' + cssId(baseId));
  const ccIds = picked('tbCC_' + cssId(baseId));
  if (!primaryIds.length) { toast('A task needs at least one person assigned', 'err'); return; }
  try {
    const d = await apiJson(API_URL + '?' + new URLSearchParams({
      action: 'aiAssign', userId: USER_ID, baseId,
      primaryIds: primaryIds.join(','), ccIds: ccIds.join(',')
    }).toString());
    if (!d || d.success === false) throw new Error((d && d.error) || 'refused');
    const bits = [];
    if (d.added && d.added.length) bits.push('added ' + d.added.join(', '));
    if (d.removed && d.removed.length) bits.push('removed ' + d.removed.join(', '));
    if (d.changed && d.changed.length) bits.push(d.changed.join(', '));
    toast(bits.length ? bits.join(' · ') : 'No change');
    load();
  } catch (e) {
    toast('Not saved: ' + (e.message || e), 'err');
  }
}

// Ids contain characters querySelector would treat as syntax, so escape them.
function cssId(v) { return String(v).replace(/[^A-Za-z0-9_-]/g, '_'); }

async function deleteTask(baseId, restore) {
  const g = TASKS.groups.find(x => x.baseId === baseId);
  const n = g ? g.rowCount : '?';
  if (!restore && !confirm('Delete this task?\n\n' + (g ? g.displayText : '')
      + '\n\nIt disappears from every dashboard (' + n + ' rows). The rows are kept, so this can be undone.')) return;
  try {
    const d = await apiJson(API_URL + '?' + new URLSearchParams({
      action: 'aiDelete', userId: USER_ID || '', baseId, restore: restore ? 'true' : 'false'
    }).toString());
    if (!d || d.success === false) throw new Error((d && d.error) || 'refused');
    toast(restore ? 'Restored' : 'Deleted — it can be restored from the Deleted status filter');
    selectedTask = null;
    load();
  } catch (e) {
    toast((restore ? 'Not restored: ' : 'Not deleted: ') + (e.message || e), 'err');
  }
}

function reload() {
  const b = document.getElementById('reloadBtn');
  b.disabled = true; b.textContent = '…';
  load().finally(() => { b.disabled = false; b.textContent = '↻ Refresh'; });
}

// boot
(function () {
  const banner = document.getElementById('banner');
  if (DEMO) {
    banner.hidden = false;
    banner.className = 'banner demo';
    banner.innerHTML = '🎓 <b>Demo</b> — sample rows only. Edits stay on screen and are saved nowhere.';
  } else if (!USER_ID) {
    banner.hidden = false;
    banner.className = 'banner err';
    banner.textContent = 'Opened without a user, so nothing can be saved. Reopen from Admin Tools → Sheet Views.';
  }
  document.getElementById('who').textContent = USER_NAME ? '· ' + USER_NAME : '';
  renderTabs(); renderLegend(); load();
})();
</script>
</body>
</html>
