<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sheet Views — Orem YSA 5th Stake</title>
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://unpkg.com/tabulator-tables@6.3.1/dist/css/tabulator_simple.min.css">
<style>
  :root{
    /* Pulled from the spreadsheet's own conditional formatting rules, so the grid
       reads the way the sheet does. */
    --cf-canceled:#666666;
    --cf-paused:#E06666;
    --cf-released-bg:#FCE5CD;
    --cf-released-fg:#783F04;
    --cf-stake-fg:#351C75;
    --cf-ward-fg:#1155CC;
    --cf-ticked:#A4C2F4;
    --cf-na-bg:#B7B7B7;
    --cf-na-fg:#999999;
    --cf-due-bg:#EA9999;
    --cf-due-fg:#CC0000;
    --cf-allapproved:#B7E1CD;
    --cf-approved:#6AA84F;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;background:#f5f6f8;color:#222;
  }
  header{
    background:#fff;border-bottom:1px solid #e2e5e9;flex:none;
    padding:10px 16px 0;
  }
  .titlebar{display:flex;align-items:center;gap:12px;margin-bottom:8px}
  h1{font-size:15px;font-weight:700;margin:0;letter-spacing:.01em}
  h1 .who{font-weight:400;color:#777;margin-left:8px;font-size:13px}
  .tabs{display:flex;gap:2px;overflow-x:auto}
  .tab{
    padding:9px 15px;font-size:13px;font-weight:600;color:#666;background:none;
    border:none;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;
  }
  .tab:hover{color:#222}
  .tab.active{color:#1a6159;border-bottom-color:#1a6159}
  .tab .n{font-weight:400;opacity:.6;margin-left:5px;font-variant-numeric:tabular-nums}
  .toolbar{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;flex:none;
    padding:9px 16px;background:#fff;border-bottom:1px solid #e2e5e9;
  }
  input[type=text],select{
    font:inherit;font-size:13px;padding:5px 8px;border:1px solid #ccd1d6;border-radius:5px;
  }
  input[type=text]{flex:1 1 240px;min-width:150px}
  button{
    font:inherit;font-size:13px;font-weight:600;padding:5px 11px;border-radius:5px;
    border:1px solid #ccd1d6;background:#fff;cursor:pointer;
  }
  button:hover{background:#f2f4f6}
  button:disabled{opacity:.5;cursor:default}
  .meta{font-size:12px;color:#777;margin-left:auto;font-variant-numeric:tabular-nums}
  #grid{flex:1;min-height:0;margin:0 8px 8px}
  .banner{
    padding:7px 16px;font-size:12.5px;background:#fff8e1;border-bottom:1px solid #f0e0a8;flex:none;
  }
  .banner.demo{background:#e8f5e9;border-bottom-color:#b9dfbc}
  .banner.err{background:#fdecea;border-bottom-color:#f5c2bd;color:#8a1c12}
  /* Headers wrap onto two lines instead of truncating, so a label is always readable. */
  .tabulator .tabulator-header .tabulator-col .tabulator-col-title{
    white-space:normal;text-overflow:clip;overflow:visible;line-height:1.25;
  }
  .tabulator .tabulator-header{white-space:normal}
  .tabulator .tabulator-col{vertical-align:bottom}
  /* Approver columns are narrow; stand their names up to save width. */
  .tabulator .tabulator-col.approver .tabulator-col-title{
    font-size:11px;letter-spacing:-.01em;
  }
  /* Column show/hide panel */
  .colpanel{
    position:absolute;top:100%;right:0;z-index:50;background:#fff;border:1px solid #ccd1d6;
    border-radius:7px;box-shadow:0 6px 22px rgba(0,0,0,.16);padding:8px;
    max-height:min(60vh,460px);overflow:auto;min-width:230px;
  }
  .colpanel .row{display:flex;align-items:center;gap:7px;padding:3px 5px;font-size:13px;border-radius:4px}
  .colpanel .row:hover{background:#f2f4f6}
  .colpanel label{cursor:pointer;flex:1}
  .colpanel .grp{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;
    color:#8a929b;padding:8px 5px 3px}
  .colpanel .acts{display:flex;gap:6px;padding:6px 4px 2px;border-top:1px solid #eee;margin-top:6px}
  .colwrap{position:relative}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:#666;padding:6px 16px;flex:none;background:#fff;border-bottom:1px solid #e2e5e9}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:2px;vertical-align:-1px;margin-right:4px;border:1px solid rgba(0,0,0,.15)}
  .toast{
    position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:99;
    background:#222;color:#fff;padding:9px 16px;border-radius:7px;font-size:13px;
    box-shadow:0 4px 14px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;
  }
  .toast.show{opacity:1}
  .toast.err{background:#b3261e}
  .toast.warn{background:#8a5410}
  /* Conditional-formatting classes, applied per cell/row by the formatters below. */
  .cf-canceled{background:var(--cf-canceled)!important;color:#111!important}
  .cf-paused{background:var(--cf-paused)!important}
  .cf-declined{background:var(--cf-canceled)!important;color:#ddd!important}
  .tabulator-row.cf-canceled .tabulator-cell,
  .tabulator-row.cf-declined .tabulator-cell{background:var(--cf-canceled);color:#e8e8e8}
  .tabulator-row.cf-paused .tabulator-cell{background:var(--cf-paused)}
</style>
</head>
<body>

<header>
  <div class="titlebar">
    <h1>📋 Sheet Views <span class="who" id="who"></span></h1>
  </div>
  <div class="tabs" id="tabs"></div>
</header>

<div class="banner" id="banner" hidden></div>

<div class="toolbar">
  <input type="text" id="search" placeholder="Search this table…" oninput="applyFilter()">
  <select id="statusFilter" onchange="applyFilter()" hidden></select>
  <span class="colwrap">
    <button onclick="toggleColPanel(event)" id="colBtn">⚙ Columns</button>
    <div class="colpanel" id="colPanel" hidden></div>
  </span>
  <button onclick="reload()" id="reloadBtn">↻ Refresh</button>
  <span class="meta" id="meta"></span>
</div>

<div class="legend" id="legend"></div>

<div id="grid"></div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/tabulator-tables@6.3.1/dist/js/tabulator.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// Sheet Views — a standalone window over the Supabase read views.
//
// Reads come straight from Supabase (~200-400ms). Every WRITE goes back through
// Apps Script, which updates the Google Sheet and mirrors the change into
// Supabase, so the sheet stays the system of record and the existing permission
// model still decides who may change what.
//
// The colours are not invented: they are the workbook's own conditional
// formatting rules, read out of the .xlsx and reimplemented here. See the
// COLOUR RULES section.
// ═══════════════════════════════════════════════════════════════════════════

const API_URL = 'https://script.google.com/macros/s/AKfycbz-8U9EqHl8nvJOypAvg0Q09Y6W6pShuJfvoaJda22LUqYPDZRRSytKZ4go5HERiyhr/exec';
const SUPABASE_URL = 'https://lrfbxbiwqnlctomjeboi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_eJToH6uWrOBEPzhkzgA_Hg_VRn81dfP';

const qp = new URLSearchParams(location.search);
const USER_ID = qp.get('userId') || '';
const DEMO = qp.get('demo') || '';
const USER_NAME = qp.get('name') || '';

let grid = null, tab = 'callings';
const counts = {};

// ── helpers ───────────────────────────────────────────────────────────────
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const _d = c => { const v = c.getValue(); return v ? String(v).slice(0, 10) : ''; };
const daysUntil = v => {
  if (!v) return null;
  const d = new Date(v); if (isNaN(d)) return null;
  return Math.round((d - new Date().setHours(0,0,0,0)) / 86400000);
};

function toast(msg, kind) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (kind ? ' ' + kind : '');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => { t.className = 'toast'; }, 3200);
}

async function sbSelect(view, query) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${view}?${query}`, {
    headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
  });
  if (!res.ok) throw new Error('Supabase ' + res.status + ': ' + (await res.text()).slice(0, 160));
  return res.json();
}

// ═══════════════════════════════════════════════════════════════════════════
// COLOUR RULES
//
// Taken verbatim from the workbook's conditionalFormatting XML. The sheet greys
// a checkbox out when that step does not apply to that calling — which is real
// information ("you do not need to tick this"), so it is reproduced here rather
// than dropped.
// ═══════════════════════════════════════════════════════════════════════════
const RX = {
  president:  /President/i,
  audit:      /Audit/i,
  secondary:  /Executive|Clerk|Bishopric/i,
  nameTag:    /Stake Executive|Stake Clerk|Stake Assistant|Bishopric|High Councilor|Relief/i,
  key:        /President|Bishop|High Councilor|Clerk|Executive/i,
};

/** Is this checkbox not applicable to this row's calling? Returns true to grey it. */
function notApplicable(field, row) {
  const calling = row.calling || '';
  const released = row.action === 'Released';
  switch (field) {
    // "Release Extended" only matters when somebody is actually being released.
    case 'release_extended':     return !row.releases && !released;
    // Counselors are only approved separately for presidencies.
    case 'counselors_approved':  return !RX.president.test(calling);
    case 'secondary_approval':   return released || !RX.secondary.test(calling);
    case 'marked_set_apart_lcr': return released || RX.audit.test(calling);
    case 'sustained':            return RX.audit.test(calling);
    case 'name_tag':             return !RX.nameTag.test(calling);
    case 'key_done':             return !RX.key.test(calling);
    case 'accepted':             return released;
    case 'set_apart':            return released;
    default: return false;
  }
}

/** Tick boxes: blue when set, grey when the step does not apply to this calling. */
function tickFormatter(cell) {
  const row = cell.getRow().getData();
  const field = cell.getField();
  const on = cell.getValue() === true;
  const na = notApplicable(field, row);
  const el = cell.getElement();
  if (el) {
    el.style.background = na ? 'var(--cf-na-bg)' : (on ? 'var(--cf-ticked)' : '');
    el.style.color = na ? 'var(--cf-na-fg)' : '';
  }
  // A greyed box that is nonetheless ticked must still show its tick. The sheet greys
  // the background and leaves the checkmark visible; replacing it with a dash would
  // hide a real state. 9 rows in the live data are exactly this case — a release whose
  // "Accepted" box was ticked anyway.
  if (on) return '<span style="font-weight:700;color:' + (na ? '#4a4a4a' : '#1a3a6b') + '">✓</span>';
  if (na) return '<span style="opacity:.55">—</span>';
  return '<span style="opacity:.3">·</span>';
}

/** Member / calling: released rows go peach; text colour follows sustaining body. */
function nameFormatter(cell) {
  const row = cell.getRow().getData();
  const el = cell.getElement();
  if (el) {
    if (row.action === 'Released') {
      el.style.background = 'var(--cf-released-bg)';
      el.style.color = 'var(--cf-released-fg)';
    } else {
      el.style.background = '';
      el.style.color = row.sustaining_body === 'Stake' ? 'var(--cf-stake-fg)'
                     : row.sustaining_body === 'Ward'  ? 'var(--cf-ward-fg)' : '';
    }
  }
  return esc(cell.getValue() || '');
}

/** Stake business date: red and bold when it is within a week and not yet added. */
function sbDateFormatter(cell) {
  const row = cell.getRow().getData();
  const v = cell.getValue();
  const el = cell.getElement();
  const d = daysUntil(v);
  const due = d !== null && d >= 0 && d <= 7 && !row.added_to_stake_business;
  if (el) {
    el.style.background = due ? 'var(--cf-due-bg)' : '';
    el.style.color = due ? 'var(--cf-due-fg)' : '';
    el.style.fontWeight = due ? '700' : '';
  }
  return v ? String(v).slice(0, 10) : '';
}

/** Whole-row shading for canceled / paused / declined. */
function rowFormatter(row) {
  const d = row.getData();
  const el = row.getElement();
  el.classList.remove('cf-canceled', 'cf-paused', 'cf-declined');
  if (d.status === 'canceled') el.classList.add('cf-canceled');
  else if (d.status === 'paused') el.classList.add('cf-paused');
  else if (d.declined) el.classList.add('cf-declined');
}

// ── editing ───────────────────────────────────────────────────────────────
const STAKE_WARDS = ['16th Ward','19th Ward','24th Ward','25th Ward',
                     '27th Ward','32nd Ward','33rd Ward','49th Ward'];
const WARD_OTHER = '➕ Other unit…';

// The eight wards, plus an escape hatch for a member called from outside the
// stake. A unit typed that way is deliberately NOT added to the list — it
// belongs to that one row, not to the stake.
function wardEditor(cell, onRendered, success, cancel) {
  const cur = cell.getValue() || '';
  const sel = document.createElement('select');
  sel.style.cssText = 'width:100%;box-sizing:border-box;font-size:13px;padding:3px;';
  const opts = ['', ...STAKE_WARDS];
  if (cur && !STAKE_WARDS.includes(cur)) opts.push(cur);   // keep an existing outside unit selectable
  opts.push(WARD_OTHER);
  opts.forEach(v => {
    const o = document.createElement('option');
    o.value = v; o.textContent = v || '—';
    if (v === cur) o.selected = true;
    sel.appendChild(o);
  });
  const finish = () => {
    if (sel.value === WARD_OTHER) {
      const typed = (prompt('Unit name (a ward or stake outside ours):', '') || '').trim();
      if (!typed) { cancel(); return; }
      success(typed);
      return;
    }
    success(sel.value);
  };
  sel.addEventListener('change', finish);
  sel.addEventListener('blur', () => { if (sel.value !== WARD_OTHER) success(sel.value); });
  sel.addEventListener('keydown', e => { if (e.key === 'Escape') cancel(); });
  onRendered(() => sel.focus());
  return sel;
}

async function saveCell(cell, gridName, keyField) {
  const row = cell.getRow().getData();
  const field = cell.getField();
  const before = cell.getOldValue();
  const el = cell.getElement();

  if (DEMO) {
    toast('Demo — the change is not saved anywhere');
    return;
  }
  if (!USER_ID) {
    cell.setValue(before, true);
    toast('No user — reopen this window from the dashboard', 'err');
    return;
  }
  if (el) el.style.outline = '2px solid #f0b429';
  try {
    const params = new URLSearchParams({
      action: 'updateGridCell', userId: USER_ID, grid: gridName,
      rowKey: String(row[keyField] ?? ''), field: field,
      value: cell.getValue() === null || cell.getValue() === undefined ? '' : cell.getValue()
    });
    const res = await fetch(API_URL + '?' + params.toString());
    const data = await res.json();
    if (!data || data.success === false) throw new Error((data && data.error) || 'refused');
    if (el) {
      el.style.outline = '2px solid #4caf50';
      setTimeout(() => { el.style.outline = ''; }, 900);
    }
    if (data.mirrored && data.mirrored !== 'ok') {
      toast(data.mirrored === 'not-configured'
        ? 'Saved to the sheet. The Supabase mirror is not configured yet.'
        : 'Saved to the sheet, but the database mirror failed.', 'warn');
    }
  } catch (e) {
    cell.setValue(before, true);            // the sheet did not change; do not pretend it did
    if (el) el.style.outline = '';
    toast('Not saved: ' + (e.message || e), 'err');
  }
}

function ed(col, gridName, keyField, editor, params) {
  return Object.assign({}, col, {
    editor: editor || 'input',
    editorParams: params || {},
    cellEdited: cell => saveCell(cell, gridName, keyField),
  });
}
const tick = (title, field, width) =>
  ed({ title, field, width: width || 92, hozAlign: 'center', formatter: tickFormatter },
     'callings', 'sheet_ref', 'tickCross');

// ── approver columns ──────────────────────────────────────────────────────
// The sheet has one column per approver (T–AH). Storage keeps those as rows, so
// the columns are rebuilt here from the current roster — the high council can
// change without a schema migration.
let APPROVERS = [];

const voteMark = slackId => cell => {
  const v = (cell.getRow().getData().votes || {})[slackId];
  const el = cell.getElement();
  if (el) {
    el.style.background = v === 'approve' ? 'var(--cf-approved)'
      : v === 'oppose' ? '#cc0000'
      : v === 'hold' ? 'var(--cf-due-bg)'
      : v === 'not_applicable' ? 'var(--cf-na-bg)' : '';
    el.style.color = v === 'approve' || v === 'oppose' ? '#fff' : '';
  }
  return v === 'approve' ? '✓'
    : v === 'oppose' ? '✗'
    : v === 'hold' ? 'HOLD'
    : v === 'not_applicable' ? '<span style="opacity:.5">—</span>'
    : '<span style="opacity:.25">·</span>';
};

function approverColumns() {
  return APPROVERS.map(a => ({
    title: a.name.replace(/^(Pres|Bro|Sis)\.\s*/, ''),
    field: 'vote_' + a.slack_id,
    width: 74, hozAlign: 'center', headerSort: false,
    cssClass: 'approver',
    headerTooltip: a.name + ' — ' + a.title,
    formatter: voteMark(a.slack_id),
  }));
}

async function loadApprovers() {
  if (DEMO) {
    APPROVERS = [
      { slack_id: 'D_SP', name: 'Pres. Smith', title: 'Stake President' },
      { slack_id: 'D_1C', name: 'Pres. Plothow', title: 'Stake Presidency First Counselor' },
      { slack_id: 'D_2C', name: 'Pres. Nielsen', title: 'Stake Presidency Second Counselor' },
      ...['Ainsworth','Bellview','Corbridge','Duffin','Eastman','Fenwick',
          'Garner','Highsmith','Ivory','Justesen','Kimballton','Lockhart']
        .map((n, i) => ({ slack_id: 'D_HC' + i, name: 'Bro. ' + n, title: 'High Councilor ' + (i + 1) })),
    ];
    return;
  }
  try { APPROVERS = await sbSelect('v_clerk_approvers', 'select=*'); }
  catch (e) { APPROVERS = []; }
}

// ── the four tables ───────────────────────────────────────────────────────
const TABS = {
  callings: {
    label: '📋 Callings', view: 'v_clerk_callings', order: 'created_at.desc',
    grid: 'callings', key: 'sheet_ref', rowFormatter: rowFormatter,
    statuses: ['submitted','polling','approved','complete','declined','paused','canceled'],
    cols: [
      ed({ title: 'Member', field: 'member', minWidth: 165, headerFilter: 'input',
           frozen: true, formatter: nameFormatter }, 'callings', 'sheet_ref'),
      ed({ title: 'Calling', field: 'calling', minWidth: 205, headerFilter: 'input',
           formatter: nameFormatter }, 'callings', 'sheet_ref'),
      ed({ title: 'Ward', field: 'ward', width: 128, headerFilter: 'list',
           headerFilterParams: { valuesLookup: true, clearable: true },
           formatter: nameFormatter }, 'callings', 'sheet_ref', wardEditor),
      ed({ title: 'Action', field: 'action', width: 100, headerFilter: 'list',
           headerFilterParams: { valuesLookup: true, clearable: true } },
         'callings', 'sheet_ref', 'list', { values: ['Called', 'Released'] }),
      ed({ title: 'CTR?', field: 'ctr', width: 78 },
         'callings', 'sheet_ref', 'list', { values: ['', 'Yes', 'N/A'] }),
      ed({ title: 'Priesthood/Gender', field: 'priesthood_gender', width: 145 },
         'callings', 'sheet_ref', 'list',
         { values: ['', 'Elder', 'High Priest', 'Male', 'Female'] }),
      ed({ title: 'Released Member', field: 'releases', minWidth: 155 }, 'callings', 'sheet_ref'),
      ed({ title: 'Rel. Gender', field: 'release_gender', width: 105 },
         'callings', 'sheet_ref', 'list', { values: ['', 'Male', 'Female'] }),
      ed({ title: 'Release Ward', field: 'release_ward', width: 132 },
         'callings', 'sheet_ref', wardEditor),
      ed({ title: 'Sustaining Body', field: 'sustaining_body', width: 132, headerFilter: 'list',
           headerFilterParams: { valuesLookup: true, clearable: true } },
         'callings', 'sheet_ref', 'list', { values: ['', 'Ward', 'Stake', 'None'] }),
      ed({ title: 'Submitter', field: 'submitter', minWidth: 145 }, 'callings', 'sheet_ref'),
      ed({ title: 'On Behalf Of', field: 'on_behalf_of', minWidth: 145 }, 'callings', 'sheet_ref'),
      ed({ title: 'Comments', field: 'comments', minWidth: 210 },
         'callings', 'sheet_ref', 'textarea'),
      ed({ title: 'Interview?', field: 'interview_status', width: 110 },
         'callings', 'sheet_ref', 'list', { values: ['', 'N/A', 'Needed', 'Complete'] }),
      ed({ title: 'Poll?', field: 'poll_ready', width: 74, hozAlign: 'center', formatter: 'tickCross' },
         'callings', 'sheet_ref', 'tickCross'),
      ed({ title: 'Priority', field: 'urgency', width: 96, headerFilter: 'list',
           headerFilterParams: { valuesLookup: true, clearable: true } },
         'callings', 'sheet_ref', 'list', { values: ['normal', 'urgent'] }),
      '@APPROVERS@',
      { title: 'Status', field: 'status', width: 106,
        formatter: c => {
          const v = c.getValue() || '';
          const tone = v === 'complete' ? '#2e7d32'
            : (v === 'paused' || v === 'canceled') ? '#7a4a00'
            : v === 'declined' ? '#c62828' : '#555';
          return '<span style="color:' + tone + ';font-weight:600;">' + esc(v) + '</span>';
        } },
      { title: 'Appr', field: 'approved_count', width: 64, hozAlign: 'right',
        formatter: c => {
          // The sheet turns the approval block green once every approver has said yes.
          const r = c.getRow().getData();
          const el = c.getElement();
          if (el) el.style.background = (r.awaiting === 0 && c.getValue() > 0)
            ? 'var(--cf-allapproved)' : '';
          return c.getValue();
        } },
      { title: 'Await', field: 'awaiting', width: 64, hozAlign: 'right',
        formatter: c => c.getValue() > 0
          ? '<span style="color:#b26500;font-weight:700;">' + c.getValue() + '</span>' : '' },
      tick('Accepted', 'accepted'),
      tick('Couns. Appr.', 'counselors_approved', 110),
      tick('Rel. Extended', 'release_extended', 115),
      ed({ title: 'Sched. Stake Bus.', field: 'stake_business_date', width: 140,
           formatter: sbDateFormatter }, 'callings', 'sheet_ref', 'date', { format: 'yyyy-MM-dd' }),
      { title: 'Hold', field: 'held', width: 62, hozAlign: 'center',
        formatter: c => c.getValue() ? '<b style="color:#b26500">HOLD</b>' : '' },

// ── column visibility ─────────────────────────────────────────────────────
// Which columns are hidden is remembered per table, in this browser. Widths are
// remembered too, so a clerk who narrows a column keeps it narrow.
const LS_HIDDEN = 'sheetviews_hidden_v1';
const LS_WIDTHS = 'sheetviews_widths_v1';

function readLS(key) {
  try { return JSON.parse(localStorage.getItem(key) || '{}'); } catch (e) { return {}; }
}
function writeLS(key, val) {
  try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {}
}
const hiddenFor = t => (readLS(LS_HIDDEN)[t] || []);
function setHidden(t, list) {
  const all = readLS(LS_HIDDEN); all[t] = list; writeLS(LS_HIDDEN, all);
}

function rememberWidth(field, w) {
  const all = readLS(LS_WIDTHS);
  (all[tab] = all[tab] || {})[field] = w;
  writeLS(LS_WIDTHS, all);
}

function toggleColPanel(ev) {
  if (ev) ev.stopPropagation();
  const panel = document.getElementById('colPanel');
  if (!panel.hidden) { panel.hidden = true; return; }
  renderColPanel();
  panel.hidden = false;
}
document.addEventListener('click', e => {
  const panel = document.getElementById('colPanel');
  if (!panel || panel.hidden) return;
  if (!panel.contains(e.target) && e.target.id !== 'colBtn') panel.hidden = true;
});

function renderColPanel() {
  const panel = document.getElementById('colPanel');
  if (!grid) { panel.innerHTML = '<div class="row">Nothing loaded yet</div>'; return; }
  const hidden = new Set(hiddenFor(tab));
  const cols = TABS[tab].cols;
  const isApprover = f => String(f || '').startsWith('vote_');
  const groups = [
    ['Columns', cols.filter(c => c.field && !isApprover(c.field))],
    ['Approvers', cols.filter(c => isApprover(c.field))],
  ].filter(g => g[1].length);

  panel.innerHTML = groups.map(([label, list]) =>
    `<div class="grp">${label}</div>` + list.map(c => {
      const on = !hidden.has(c.field);
      return `<div class="row">
        <input type="checkbox" id="cb_${esc(c.field)}" ${on ? 'checked' : ''}
               onchange="setColVisible('${esc(c.field)}', this.checked)">
        <label for="cb_${esc(c.field)}">${esc(String(c.title))}</label>
      </div>`;
    }).join('')).join('')
    + `<div class="acts">
         <button onclick="showAllCols()">Show all</button>
         <button onclick="hideApprovers()">Hide approvers</button>
       </div>`;
}

function setColVisible(field, visible) {
  const hidden = new Set(hiddenFor(tab));
  if (visible) hidden.delete(field); else hidden.add(field);
  setHidden(tab, [...hidden]);
  if (!grid) return;
  try { visible ? grid.showColumn(field) : grid.hideColumn(field); } catch (e) {}
}

function showAllCols() {
  setHidden(tab, []);
  if (grid) TABS[tab].cols.forEach(c => { try { grid.showColumn(c.field); } catch (e) {} });
  renderColPanel();
}

function hideApprovers() {
  const list = TABS[tab].cols.map(c => c.field).filter(f => String(f || '').startsWith('vote_'));
  const hidden = new Set(hiddenFor(tab));
  list.forEach(f => hidden.add(f));
  setHidden(tab, [...hidden]);
  if (grid) list.forEach(f => { try { grid.hideColumn(f); } catch (e) {} });
  renderColPanel();
}

// ── shell ─────────────────────────────────────────────────────────────────
function renderTabs() {
  document.getElementById('tabs').innerHTML = Object.keys(TABS).map(k =>
    `<button class="tab${k === tab ? ' active' : ''}" onclick="switchTab('${k}')">`
    + TABS[k].label
    + (counts[k] != null ? `<span class="n">${counts[k]}</span>` : '')
    + '</button>').join('');
}

function renderLegend() {
  const items = tab === 'callings' ? [
    ['var(--cf-released-bg)', 'a release'],
    ['transparent', '<span style="color:var(--cf-stake-fg);font-weight:700">stake</span> / '
      + '<span style="color:var(--cf-ward-fg);font-weight:700">ward</span> sustaining'],
    ['var(--cf-ticked)', 'done'],
    ['var(--cf-na-bg)', 'not needed for this calling'],
    ['var(--cf-due-bg)', 'stake business within a week, not yet added'],
    ['var(--cf-allapproved)', 'everyone has approved'],
    ['var(--cf-canceled)', 'canceled / declined'],
    ['var(--cf-paused)', 'paused'],
  ] : [];
  const el = document.getElementById('legend');
  el.hidden = !items.length;
  el.innerHTML = items.map(([c, l]) =>
    (c === 'transparent' ? '' : `<i style="background:${c}"></i>`) + l).join('');
}

function switchTab(k) {
  if (k === tab) return;
  tab = k;
  document.getElementById('search').value = '';
  renderTabs(); renderLegend(); load();
}

function applyFilter() {
  if (!grid) return;
  const q = (document.getElementById('search').value || '').toLowerCase();
  const st = document.getElementById('statusFilter').value || '';
  if (!q && !st) { grid.clearFilter(); return; }
  grid.setFilter(row => {
    if (st && row.status !== st) return false;
    if (!q) return true;
    return Object.values(row).some(v => v != null && String(v).toLowerCase().includes(q));
  });
}

async function load() {
  if (tab === 'callings' && !APPROVERS.length) await loadApprovers();
  const spec = TABS[tab];
  // The approver columns depend on the roster, which is fetched — splice them in
  // at the placeholder now that it is known.
  if (spec.cols.includes('@APPROVERS@')) {
    const i = spec.cols.indexOf('@APPROVERS@');
    spec.cols.splice(i, 1, ...approverColumns());
  }
  const box = document.getElementById('grid');
  const t0 = Date.now();
  if (grid) { try { grid.destroy(); } catch (e) {} grid = null; }
  box.innerHTML = '<p style="padding:16px;color:#777;font-size:13px">Loading…</p>';

  // status dropdown, per table
  const sf = document.getElementById('statusFilter');
  sf.hidden = !spec.statuses;
  if (spec.statuses) {
    sf.innerHTML = '<option value="">All statuses</option>'
      + spec.statuses.map(s => `<option value="${s}">${s}</option>`).join('');
  }

  try {
    const rows = DEMO ? demoRows(tab) : await sbSelect(spec.view, 'select=*&order=' + spec.order);
    const ms = Date.now() - t0;
    box.innerHTML = '';
    const hidden = new Set(hiddenFor(tab));
    const savedWidths = (readLS(LS_WIDTHS)[tab]) || {};
    const cols = spec.cols.map(c => Object.assign({}, c, {
      visible: !hidden.has(c.field),
      width: savedWidths[c.field] || c.width,
      // Every header gets its full text on hover, so a narrowed column is still readable.
      headerTooltip: c.headerTooltip || String(c.title),
    }));
    grid = new Tabulator(box, {
      data: rows, layout: 'fitDataStretch', height: '100%',
      placeholder: 'Nothing here', columns: cols,
      rowFormatter: spec.rowFormatter || undefined,
      movableColumns: true,
      columnDefaults: { resizable: true, headerWordWrap: true },
    });
    grid.on('columnResized', col => {
      try { rememberWidth(col.getField(), col.getWidth()); } catch (e) {}
    });
    counts[tab] = rows.length;
    renderTabs();
    if (!document.getElementById('colPanel').hidden) renderColPanel();
    document.getElementById('meta').textContent = DEMO
      ? rows.length + ' sample rows'
      : rows.length + ' rows · ' + ms + 'ms';
  } catch (e) {
    box.innerHTML = '<p style="padding:16px;color:#b3261e;font-size:13px">Could not load: '
      + esc(e.message || e) + '</p>';
  }
}

function reload() {
  const b = document.getElementById('reloadBtn');
  b.disabled = true; b.textContent = '…';
  load().finally(() => { b.disabled = false; b.textContent = '↻ Refresh'; });
}

// boot
(function () {
  const banner = document.getElementById('banner');
  if (DEMO) {
    banner.hidden = false;
    banner.className = 'banner demo';
    banner.innerHTML = '🎓 <b>Demo</b> — sample rows only. Edits stay on screen and are saved nowhere.';
  } else if (!USER_ID) {
    banner.hidden = false;
    banner.className = 'banner err';
    banner.textContent = 'Opened without a user, so nothing can be saved. Reopen from Admin Tools → Sheet Views.';
  }
  document.getElementById('who').textContent = USER_NAME ? '· ' + USER_NAME : '';
  renderTabs(); renderLegend(); load();
})();
