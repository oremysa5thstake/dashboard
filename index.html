<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Orem YSA 5th Stake Task Center">
  <meta name="theme-color" content="#5865F2">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stake Tasks">
  <title>Stake Task Center</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="https://www.churchofjesuschrist.org/favicon.ico">

  <style>
    /* Exact copy of Dashboard Web styles */
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f5f5f5;color:#1a1a1a;line-height:1.5}
    .container{max-width:900px;margin:0 auto;padding:16px}
    header{background:linear-gradient(135deg,#5865F2,#7289DA);color:#fff;padding:20px;margin-bottom:20px;border-radius:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}
    header h1{font-size:22px;font-weight:600}
    .header-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
    .user-info{font-size:14px;opacity:.9}
    .header-btn{background:rgba(255,255,255,.2);border:none;color:#fff;padding:8px 14px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .2s}
    .header-btn:hover{background:rgba(255,255,255,.3)}
    .header-btn:disabled{opacity:.5;cursor:not-allowed}
    .loading{text-align:center;padding:60px 20px;color:#666}
    .spinner{width:40px;height:40px;border:3px solid #e0e0e0;border-top-color:#5865F2;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 16px}
    @keyframes spin{to{transform:rotate(360deg)}}
    .summary-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .summary-card{background:#fff;padding:16px 20px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.1);flex:1;min-width:100px;text-align:center;cursor:pointer;transition:transform .2s,box-shadow .2s}
    .summary-card:hover{transform:translateY(-2px);box-shadow:0 4px 8px rgba(0,0,0,.15)}
    .summary-card .number{font-size:28px;font-weight:700;color:#5865F2}
    .summary-card .label{font-size:12px;color:#666;margin-top:2px}
    .summary-card.urgent .number{color:#dc3545}
    .section{background:#fff;border-radius:12px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.1);overflow:hidden}
    .section-header{padding:14px 20px;background:#fafafa;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background .2s}
    .section-header:hover{background:#f0f0f0}
    .section-title{font-size:15px;font-weight:600;display:flex;align-items:center;gap:10px}
    .section-meta{display:flex;align-items:center;gap:10px}
    .section-count{background:#5865F2;color:#fff;padding:2px 10px;border-radius:12px;font-size:12px;font-weight:500}
    .chevron{transition:transform .3s;color:#999;font-size:12px}
    .section-header.expanded .chevron{transform:rotate(180deg)}
    .section-content{max-height:0;overflow:hidden;transition:max-height .3s ease-in-out}
    .section-content.expanded{max-height:5000px}
    .section-inner{padding:16px 20px}
    .bulk-actions{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
    .item{padding:14px 16px;border:1px solid #e8e8e8;border-radius:8px;margin-bottom:10px;background:#fafafa;transition:border-color .2s}
    .item:hover{border-color:#5865F2}
    .item:last-child{margin-bottom:0}
    .item-header{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:6px}
    .item-title{font-weight:600;font-size:14px;flex:1}
    .item-meta{font-size:13px;color:#666;margin-bottom:10px}
    .item-actions{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    .btn{padding:7px 14px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;display:inline-flex;align-items:center;gap:5px;text-decoration:none;transition:all .2s}
    .btn-primary{background:#5865F2;color:#fff}
    .btn-primary:hover{background:#4752c4}
    .btn-success{background:#28a745;color:#fff}
    .btn-success:hover{background:#218838}
    .btn-warning{background:#ffc107;color:#333}
    .btn-warning:hover{background:#e0a800}
    .btn-danger{background:#dc3545;color:#fff}
    .btn-danger:hover{background:#c82333}
    .btn-secondary{background:#e8e8e8;color:#333}
    .btn-secondary:hover{background:#d8d8d8}
    .btn:disabled{opacity:.5;cursor:not-allowed}
    .empty-state{text-align:center;padding:40px 20px;color:#888}
    .empty-state .icon{font-size:48px;margin-bottom:12px;opacity:.5}
    .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(100px);background:#333;color:#fff;padding:12px 24px;border-radius:8px;font-size:14px;opacity:0;transition:all .3s;z-index:1000;box-shadow:0 4px 12px rgba(0,0,0,.3)}
    .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
    .toast.success{background:#28a745}
    .toast.error{background:#dc3545}
    .hidden{display:none!important}
    .error-page{text-align:center;padding:60px 20px}
    .error-page h2{color:#dc3545;margin-bottom:16px}
    .error-page p{color:#666;line-height:1.6}
    .cc-section{background:#fefbe8;border:1px solid #d4c060}
    .cc-section .section-header{background:#f5eeaa}
    .cc-section .section-header:hover{background:#ede580}
    .cc-section .item{background:#fffde4;border-color:#e8d87a}
    .ack-section{background:#fdf0f5;border:1px solid #e0a8c0}
    .ack-section .section-header{background:#f9d5e5}
    .ack-section .section-header:hover{background:#f5c2d8}
    .ack-section .item{background:#fef6f9;border-color:#ecc5d8}
    .admin-section{background:#fff3cd;border:1px solid #ffc107}
    .admin-section .section-header{background:#fff3cd}
    .settings-label{font-weight:600;font-size:14px;margin-bottom:8px;color:#333}
    .btn-sm{padding:5px 10px;font-size:12px}
    .modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;opacity:0;visibility:hidden;transition:all .3s}
    .modal-overlay.show{opacity:1;visibility:visible}
    .modal{background:#fff;border-radius:12px;width:90%;max-width:500px;max-height:90vh;overflow:auto;transform:scale(.9);transition:transform .3s}
    .modal-overlay.show .modal{transform:scale(1)}
    .modal-header{padding:16px 20px;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center}
    .modal-title{font-size:18px;font-weight:600}
    .modal-close{background:none;border:none;font-size:24px;color:#999;cursor:pointer;padding:0;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
    .modal-close:hover{color:#333}
    .modal-body{padding:20px}
    .modal-footer{padding:16px 20px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:10px}
    .form-group{margin-bottom:16px}
    .form-label{display:block;margin-bottom:6px;font-weight:500;font-size:13px;color:#333}
    .form-select{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;background:#fff}
    .form-select:focus{outline:none;border-color:#5865F2}
    .form-textarea{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;resize:vertical;min-height:80px}
    .form-textarea:focus{outline:none;border-color:#5865F2}
    .form-input{width:100%;padding:8px 12px;border:1px solid #ddd;border-radius:6px;font-size:13px;background:#fff}
    .form-input:focus{outline:none;border-color:#5865F2}
    .dashboard-message{background:#e8f4f8;border:1px solid #bee5eb;border-radius:8px;padding:12px 16px;margin-bottom:20px;color:#0c5460;font-size:14px;line-height:1.5}
    .stake-links{background:#fff;border-radius:12px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.1);overflow:hidden}
    .stake-links-header{padding:14px 20px;background:#fafafa;border-bottom:1px solid #eee;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:background .2s}
    .stake-links-header:hover{background:#f0f0f0}
    .stake-links-content{max-height:0;overflow:hidden;transition:max-height .3s ease-in-out}
    .stake-links-content.expanded{max-height:500px}
    .stake-links-inner{padding:16px 20px;display:flex;flex-wrap:wrap;gap:10px}
    .stake-link{background:#5865F2;color:#fff;padding:8px 16px;border-radius:6px;text-decoration:none;font-size:13px;font-weight:500;transition:background .2s}
    .stake-link:hover{background:#4752c4}
    .settings-group{margin-bottom:20px}
    .settings-label{font-weight:600;font-size:14px;margin-bottom:8px;color:#333}
    .radio-group{display:flex;gap:8px;flex-wrap:wrap}
    .radio-option{padding:8px 14px;border:1px solid #ddd;border-radius:6px;font-size:13px;cursor:pointer;transition:all .2s;background:#fff}
    .radio-option:hover{background:#f5f5f5;border-color:#5865F2}
    .radio-option.selected{background:#5865F2;color:#fff;border-color:#5865F2}
    @media(max-width:600px){.container{padding:12px}header{flex-direction:column;text-align:center}.header-right{width:100%;justify-content:center}.summary-bar{flex-direction:column}}
    .help-btn{display:inline-flex;align-items:center;justify-content:center;width:18px;height:18px;border-radius:50%;background:#d8d8d8;color:#555;font-size:11px;font-weight:700;cursor:pointer;border:none;padding:0;line-height:1;transition:all .15s;flex-shrink:0;font-family:inherit}
    .help-btn:hover{background:#5865F2;color:#fff;transform:scale(1.1)}
    .help-popover{position:fixed;background:#fff;border:1px solid #ddd;border-radius:10px;padding:14px 16px 12px;box-shadow:0 6px 20px rgba(0,0,0,.18);font-size:13px;line-height:1.5;color:#333;max-width:320px;min-width:240px;z-index:1100;display:none}
    .help-popover.show{display:block}
    .help-popover h4{font-size:14px;margin-bottom:8px;color:#1a1a1a;padding-right:22px;font-weight:600}
    .help-popover p{margin-bottom:6px}
    .help-popover ul{margin:6px 0 6px 18px}
    .help-popover li{margin-bottom:4px}
    .help-popover-close{position:absolute;top:6px;right:8px;background:none;border:none;font-size:20px;cursor:pointer;color:#999;line-height:1;padding:0;width:24px;height:24px}
    .help-popover-close:hover{color:#333}
    .user-overlay{position:fixed;inset:0;background:#f5f5f5;z-index:2000;display:none;flex-direction:column;overflow:hidden}
    .user-overlay.open{display:flex}
    .user-overlay-header{background:#5865F2;color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;flex-shrink:0;box-shadow:0 2px 4px rgba(0,0,0,.15)}
    .user-overlay-title{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:12px}
    .user-overlay-close{background:rgba(255,255,255,.2);color:#fff;border:none;padding:7px 14px;border-radius:6px;font-size:13px;font-weight:600;cursor:pointer;flex-shrink:0}
    .user-overlay-close:hover{background:rgba(255,255,255,.3)}
    .user-overlay-content{flex:1;overflow-y:auto;padding:16px;-webkit-overflow-scrolling:touch}
  </style>
</head>
<body>
  <div id="userOverlay" class="user-overlay" role="dialog" aria-modal="true" aria-labelledby="userOverlayName">
    <div class="user-overlay-header">
      <div class="user-overlay-title">👤 Viewing as: <span id="userOverlayName"></span></div>
      <button class="user-overlay-close" onclick="closeUserDashboardOverlay()">✕ Close</button>
    </div>
    <div class="user-overlay-content" id="overlayContent"></div>
  </div>

  <div class="container">
    <header>
      <h1>📋 Dashboard</h1>
      <div class="header-right">
        <span class="user-info" id="userInfo">Loading...</span>
        <button class="header-btn" onclick="openNewTaskModal()">➕ New Task</button>
        <button class="header-btn" onclick="toggleSettings()">⚙️</button>
        <button class="header-btn" id="refreshBtn" onclick="refreshData()" title="Refresh data">🔄 Refresh</button>
        <span id="syncIndicator" style="font-size:11px;opacity:0.65;visibility:hidden;padding:3px 8px;background:rgba(255,255,255,.15);border-radius:4px;">⏳ Syncing</span>
      </div>
    </header>

    <div id="content">
      <div class="loading">
        <div class="spinner"></div>
        <p>Loading your dashboard...</p>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div class="help-popover" id="helpPopover"></div>

  <!-- Reassign Modal -->
  <div class="modal-overlay" id="reassignModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Reassign Task</span>
        <button class="modal-close" onclick="closeReassignModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Task</label>
          <div id="reassignTaskText" style="padding:10px;background:#f5f5f5;border-radius:6px;font-size:13px;"></div>
        </div>
        <div class="form-group">
          <label class="form-label">Primary Assignee(s) *</label>
          <div id="reassignPrimaryContainer"></div>
          <button type="button" class="btn btn-sm btn-secondary" onclick="addReassignPrimary()" style="margin-top:8px;">+ Add Primary</button>
        </div>
        <div class="form-group">
          <label class="form-label">CC Group</label>
          <select class="form-select" id="reassignCCGroup" onchange="onCCGroupChange()">
            <option value="none">None</option>
            <option value="stake-presidency">Stake Presidency</option>
            <option value="extended-stake-presidency">Extended Stake Presidency</option>
            <option value="high-council">High Council</option>
            <option value="other">Other (Select Individuals)</option>
          </select>
        </div>
        <div class="form-group" id="reassignCCIndividualsGroup" style="display:none;">
          <label class="form-label">CC Individuals</label>
          <div id="reassignCCContainer"></div>
          <button type="button" class="btn btn-sm btn-secondary" onclick="addReassignCC()" style="margin-top:8px;">+ Add CC</button>
        </div>
        <div class="form-group" id="reassignAppointmentWarning" style="display:none;">
          <div style="padding:10px;background:#fff3cd;border:1px solid #ffc107;border-radius:6px;font-size:13px;" id="reassignAppointmentWarningText"></div>
          <label style="display:flex;align-items:center;gap:8px;margin-top:10px;cursor:pointer;font-size:14px;">
            <input type="checkbox" id="keepAppointmentCheckbox" checked>
            Keep this appointment date for the reassigned task
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeReassignModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitReassign()">Reassign</button>
      </div>
    </div>
  </div>

  <!-- Reschedule Appointment Modal -->
  <div class="modal-overlay" id="rescheduleModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">📅 Reschedule Appointment</span>
        <button class="modal-close" onclick="closeRescheduleModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <div id="rescheduleTaskText" style="padding:10px;background:#f5f5f5;border-radius:6px;font-size:13px;margin-bottom:4px;"></div>
        </div>
        <div class="form-group">
          <label class="form-label">New Date *</label>
          <input type="date" class="form-input" id="rescheduleDate">
        </div>
        <div class="form-group">
          <label class="form-label">New Time *</label>
          <input type="time" class="form-input" id="rescheduleTime">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeRescheduleModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitReschedule()">Update</button>
      </div>
    </div>
  </div>

  <!-- Ordination Report Modal -->
  <div class="modal-overlay" id="ordinationReportModal">
    <div class="modal" style="max-width:560px;">
      <div class="modal-header">
        <span class="modal-title">📝 Report Ordination</span>
        <button class="modal-close" onclick="closeOrdinationReportModal()">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Date of Ordination *</label>
          <input type="date" class="form-input" id="ordRepDateOrdained">
        </div>
        <div style="font-weight:600;font-size:14px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #eee;">Person Who Performed the Ordination</div>
        <div class="form-group">
          <label class="form-label">Full Name *</label>
          <input type="text" class="form-input" id="ordRepOrdainerName" placeholder="Full name">
        </div>
        <div class="form-group">
          <label class="form-label">Birth Date *</label>
          <input type="date" class="form-input" id="ordRepOrdainerBirthDate">
        </div>
        <div class="form-group">
          <label class="form-label">MRN (Member Record Number)</label>
          <input type="text" class="form-input" id="ordRepOrdainerMRN" placeholder="e.g. 123456789">
        </div>
        <div class="form-group">
          <label class="form-label">Office / Priesthood</label>
          <input type="text" class="form-input" id="ordRepOrdainerOffice" placeholder="e.g. High Priest">
        </div>
        <div style="font-weight:600;font-size:14px;margin-bottom:12px;padding-bottom:6px;border-bottom:1px solid #eee;">Stake Representative</div>
        <div class="form-group">
          <label class="form-label">Name</label>
          <input type="text" class="form-input" id="ordRepStakeRepName" placeholder="Name of stake representative present">
        </div>
        <div class="form-group">
          <label class="form-label">Calling</label>
          <input type="text" class="form-input" id="ordRepStakeRepCalling" placeholder="e.g. High Councilor">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeOrdinationReportModal()">Cancel</button>
        <button class="btn btn-primary" onclick="submitOrdinationReport()">Submit Report</button>
      </div>
    </div>
  </div>

  <!-- Create Task Modal -->
  <div class="modal-overlay" id="newTaskModal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Create New Task</span>
        <button class="modal-close" onclick="closeModal('newTaskModal')">×</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Task Description *</label>
          <textarea class="form-textarea" id="taskDescription" placeholder="What needs to be done?"></textarea>
        </div>
        <div class="form-group">
          <label class="form-label">Assign To *</label>
          <div id="taskAssigneeContainer"></div>
          <button type="button" class="btn btn-sm btn-secondary" onclick="addTaskAssignee()" style="margin-top:8px;">+ Add Assignee</button>
        </div>
        <div class="form-group">
          <label class="form-label">CC (Optional)</label>
          <div id="taskCCContainer"></div>
          <button type="button" class="btn btn-sm btn-secondary" onclick="addTaskCC()" style="margin-top:8px;">+ Add CC</button>
        </div>
        <div class="form-group">
          <label class="form-label">Due Date (Optional)</label>
          <div style="display:flex;gap:8px;">
            <input type="date" class="form-input" id="taskDueDate" style="flex:1">
            <input type="time" class="form-input" id="taskDueTime" style="flex:1">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">Notes (Optional)</label>
          <textarea class="form-textarea" id="taskNotes" placeholder="Additional notes..." style="min-height:60px"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="closeModal('newTaskModal')">Cancel</button>
        <button class="btn btn-primary" onclick="createTask()">Create Task</button>
      </div>
    </div>
  </div>

  <script>
    // Configuration
    const API_URL = 'https://script.google.com/macros/s/AKfycbz-8U9EqHl8nvJOypAvg0Q09Y6W6pShuJfvoaJda22LUqYPDZRRSytKZ4go5HERiyhr/exec';

    // Global state
    let userId = null;
    // While the admin "View as another user" overlay is open, we render the
    // target user's dashboard into #overlayContent (and swap `userId` so
    // actions POST as that user). closeUserDashboardOverlay restores both.
    let renderTargetId = 'content';
    let stashedUserId = null;
    let userData = null;
    let currentData = null;
    let users = [];
    let currentReassignId = null;
    let currentReassignAppointmentStatus = null;
    let currentRescheduleId = null;
    let originalPrimaryIds = [];
    let ccGroupMembers = {};
    let showSettings = false;
    let currentMentionId = null;
    let sectionExpanded = {};

    // ============================================================
    // CLIENT-SIDE CACHE (instant load + background refresh)
    // ============================================================
    const CACHE_VERSION = 1;
    const DASHBOARD_CACHE_TTL = 5 * 60 * 1000; // 5 min
    const USERS_CACHE_TTL = 30 * 60 * 1000;    // 30 min

    function saveDashboardCache(data) {
      try { localStorage.setItem('dashCache_' + userId, JSON.stringify({ v: CACHE_VERSION, data, ts: Date.now() })); } catch (e) {}
    }
    function loadDashboardCache() {
      try {
        const raw = localStorage.getItem('dashCache_' + userId);
        if (!raw) return null;
        const { v, data, ts } = JSON.parse(raw);
        return (v === CACHE_VERSION && Date.now() - ts < DASHBOARD_CACHE_TTL) ? data : null;
      } catch (e) { return null; }
    }
    function saveUsersCache(data) {
      try { localStorage.setItem('usersCache_' + userId, JSON.stringify({ v: CACHE_VERSION, data, ts: Date.now() })); } catch (e) {}
    }
    function loadUsersCache() {
      try {
        const raw = localStorage.getItem('usersCache_' + userId);
        if (!raw) return null;
        const { v, data, ts } = JSON.parse(raw);
        return (v === CACHE_VERSION && Date.now() - ts < USERS_CACHE_TTL) ? data : null;
      } catch (e) { return null; }
    }

    // Sync indicator (small, non-blocking)
    function setSyncing(on) {
      const el = document.getElementById('syncIndicator');
      if (el) el.style.visibility = on ? 'visible' : 'hidden';
    }

    // Silent background refresh — no spinner, preserves scroll position
    // Only re-renders if counts actually changed
    let silentRefreshTimer = null;
    function scheduleSilentRefresh(delay = 6000) {
      if (silentRefreshTimer) clearTimeout(silentRefreshTimer);
      silentRefreshTimer = setTimeout(async () => {
        silentRefreshTimer = null;
        await silentRefresh();
      }, delay);
    }
    async function silentRefresh() {
      setSyncing(true);
      try {
        const url = `${API_URL}?action=getDashboard&userId=${encodeURIComponent(userId)}&forceRefresh=true`;
        const response = await fetch(url, { method: 'GET' });
        if (!response.ok) return;
        const data = await response.json();
        if (!data || data.success === false) return;
        saveDashboardCache(data);
        // Only re-render if counts changed (avoids jarring re-render while user is reading)
        const changed = !currentData || JSON.stringify(currentData.counts) !== JSON.stringify(data.counts);
        if (changed && !document.querySelector('.modal-overlay.show')) {
          const scrollY = window.scrollY;
          onDataLoaded(data);
          requestAnimationFrame(() => window.scrollTo(0, scrollY));
        } else {
          // Update internal data without re-rendering
          currentData = data;
        }
      } catch (e) { /* silent */ }
      finally { setSyncing(false); }
    }

    // Storage helper functions
    function setCookie(name, value, days) {
      const expires = days ? `; expires=${new Date(Date.now() + days * 864e5).toUTCString()}` : '';
      try {
        document.cookie = `${name}=${encodeURIComponent(value)}${expires}; path=/; SameSite=None; Secure`;
      } catch (e) {
        console.error('Cookie set failed:', e);
      }
    }

    function getCookie(name) {
      try {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return decodeURIComponent(parts.pop().split(';').shift());
      } catch (e) {
        console.error('Cookie get failed:', e);
      }
      return null;
    }

    // Try ALL storage methods for iOS compatibility
    function saveUserId(uid) {
      try {
        localStorage.setItem('stakeTasksUserId', uid);
        sessionStorage.setItem('stakeTasksUserId', uid);
        setCookie('stakeTasksUserId', uid, 365);
        console.log('Saved userId to all storage types');
      } catch (e) {
        console.error('Storage save failed:', e);
      }
    }

    function loadUserId() {
      try {
        return localStorage.getItem('stakeTasksUserId') ||
               sessionStorage.getItem('stakeTasksUserId') ||
               getCookie('stakeTasksUserId');
      } catch (e) {
        console.error('Storage load failed:', e);
        return null;
      }
    }

    // Debounce helper
    let settingSaveTimers = {};
    function debouncedSaveSetting(key, val, element) {
      // Clear existing timer for this setting
      if (settingSaveTimers[key]) {
        clearTimeout(settingSaveTimers[key]);
      }

      // Update UI immediately
      const parent = element.parentElement;
      parent.querySelectorAll('.radio-option').forEach(el => el.classList.remove('selected'));
      element.classList.add('selected');

      // Debounce the actual save
      settingSaveTimers[key] = setTimeout(async () => {
        try {
          await performAction('saveSetting', { key: key, value: val });
          showToast('Setting saved', 'success');
        } catch (error) {
          showToast('Error saving setting: ' + error.message, 'error');
        }
      }, 500); // Wait 500ms after last change
    }

    // Initialize
    window.addEventListener('DOMContentLoaded', initApp);

    function initApp() {
      // Check if running as standalone PWA
      const isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;

      // Get userId from URL - check both query params AND hash fragment
      const urlParams = new URLSearchParams(window.location.search);
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      userId = urlParams.get('userId') || hashParams.get('userId');

      // Debug logging
      console.log('PWA Mode:', isStandalone);
      console.log('userId from URL:', userId);
      console.log('Current URL:', window.location.href);
      console.log('Hash:', window.location.hash);
      console.log('Search:', window.location.search);

      // If userId in URL, save to ALL storage types for maximum PWA compatibility
      if (userId) {
        saveUserId(userId);
        // Also update URL to include hash for future PWA launches
        if (!window.location.hash.includes('userId')) {
          window.history.replaceState(null, '', `#userId=${userId}`);
        }
      } else {
        // If not in URL, try to get from any storage type (PWA home screen launch)
        userId = loadUserId();
        console.log('Retrieved userId from storage:', userId);
        // If we got it from storage, add it to the URL hash
        if (userId && !window.location.hash.includes('userId')) {
          window.history.replaceState(null, '', `#userId=${userId}`);
        }
      }

      if (!userId) {
        const message = isStandalone
          ? 'To use the home screen app:<br>1. Open your dashboard link in Safari first<br>2. Then add to home screen<br><br>Contact your stake clerk for your link.'
          : 'Please use the link provided in your notification.';
        showErrorPage('No User ID Found', message);
        return;
      }

      // Validate userId format
      if (!userId.startsWith('U') || userId.length < 9) {
        showErrorPage('Invalid user ID', 'Please use the link provided in your notification.');
        return;
      }

      // Load dashboard and users
      loadDashboardData();
      loadUsers();
    }

    // API Functions
    async function loadDashboardData(forceRefresh = false) {
      // Show cached data immediately — eliminates blank spinner for returning users
      if (!forceRefresh) {
        const cached = loadDashboardCache();
        if (cached) {
          onDataLoaded(cached);
          // Fetch fresh data in background; show syncing indicator
          setSyncing(true);
          try {
            const url = `${API_URL}?action=getDashboard&userId=${encodeURIComponent(userId)}&forceRefresh=false`;
            const response = await fetch(url, { method: 'GET' });
            if (!response.ok) return;
            const data = await response.json();
            if (!data || data.success === false) return;
            saveDashboardCache(data);
            const changed = JSON.stringify(currentData.counts) !== JSON.stringify(data.counts);
            if (changed) onDataLoaded(data);
            else currentData = data;
          } catch (e) { console.error('Background load error:', e); }
          finally { setSyncing(false); }
          return;
        }
      }

      // No cache: show spinner and wait (first load or manual refresh)
      if (!currentData) {
        document.getElementById(renderTargetId).innerHTML = '<div class="loading"><div class="spinner"></div><p>Loading your dashboard...</p></div>';
      }
      setSyncing(true);
      try {
        const url = `${API_URL}?action=getDashboard&userId=${encodeURIComponent(userId)}&forceRefresh=${forceRefresh}`;
        const response = await fetch(url, { method: 'GET' });
        if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
        const data = await response.json();
        if (!data.success && data.error) throw new Error(data.error);
        saveDashboardCache(data);
        onDataLoaded(data);
      } catch (error) {
        console.error('Load error:', error);
        if (!currentData) {
          showToast('Failed to load dashboard: ' + error.message, 'error');
          showErrorPage('Unable to load dashboard', error.message);
        } else {
          showToast('Refresh failed — showing previous data', 'error');
        }
      } finally {
        setSyncing(false);
      }
    }

    async function performAction(action, params = {}) {
      try {
        params.userId = userId;
        params.action = action;

        // Use GET with URL parameters to avoid CORS preflight issues
        const urlParams = new URLSearchParams();
        for (const key in params) {
          urlParams.append(key, params[key]);
        }
        const url = `${API_URL}?${urlParams.toString()}`;

        const response = await fetch(url, {
          method: 'GET'
        });

        if (!response.ok) {
          throw new Error(`HTTP ${response.status}`);
        }

        const result = await response.json();

        if (!result.success) {
          throw new Error(result.error || 'Action failed');
        }

        return result;
      } catch (error) {
        console.error('Action error:', error);
        throw error;
      }
    }

    // Data handling
    function onDataLoaded(data) {
      currentData = data;
      userData = {
        name: data.userName || userId,
        userId: data.userId || userId,
        canReassign: data.canReassign || false,
        isAdmin: data.isAdmin || false
      };

      document.getElementById('userInfo').textContent = userData.name;
      renderDashboard(data);
    }

      // Sections

      if (data.sustainingReports && data.sustainingReports.length > 0) {

      // Approval / Sustaining Status — for SP / clerks / execsec only.

      if (data.approvalStatus && data.approvalStatus.length > 0) {

        html += renderAppointmentsSection(data.appointmentItems);
      }

      if (data.coordinateItems && data.coordinateItems.length > 0) {
        html += renderCoordinateOrdinationsSection(data.coordinateItems);
      }

      if (data.ordinationNotifications && data.ordinationNotifications.length > 0) {
        html += renderOrdinationNotificationsSection(data.ordinationNotifications, data.highCouncilors || []);
      }

      if (data.settingAparts && data.settingAparts.length > 0) {
        html += renderSettingApartsSection(data.settingAparts);
      }

      if (data.clerkReviews && data.clerkReviews.length > 0) {
        html += renderClerkReviewsSection(data.clerkReviews);
      }

      if (data.interviews && data.interviews.length > 0) {
        html += renderInterviewsSection(data.interviews);
      }

      if (data.ordinationInterviewSchedules && data.ordinationInterviewSchedules.length > 0) {
        html += renderOrdinationInterviewSchedulesSection(data.ordinationInterviewSchedules, data.stakePresidency || []);
      }

      if (data.ordinationInterviews && data.ordinationInterviews.length > 0) {
        html += renderOrdinationInterviewsSection(data.ordinationInterviews);
      }

      if (data.ordinationReports && data.ordinationReports.length > 0) {
        html += renderOrdinationReportsSection(data.ordinationReports);
      }

      if (data.ordinationCertificates && data.ordinationCertificates.length > 0) {
        html += renderOrdinationCertificatesSection(data.ordinationCertificates);
      }

      if (data.nameTagsToOrder && data.nameTagsToOrder.length > 0) {
        html += renderNameTagsSection(data.nameTagsToOrder);
      }

      // Mentions appear just before My Tasks so personal callouts surface together.
      if (data.mentions && data.mentions.length > 0) {
        html += renderMentionsSection(data.mentions);
      }

      if (data.myTasks && data.myTasks.length > 0) {
        html += renderTasksSection(data.myTasks);
      }

      if (data.ccItems && data.ccItems.length > 0) {
        html += renderCCSection(data.ccItems, data.highCouncilors || [], data.stakePresidency || []);
      }

      if (data.assignedToOthers && data.assignedToOthers.length > 0) {
        html += renderAssignedToOthersSection(data.assignedToOthers);
      }

      // Admin Tools section
      if (data.isAdmin && data.adminUsers && data.adminUsers.length > 0) {
        html += renderAdminSection(data.adminUsers);
      }

      // Empty state
      const hasAnyItems = data.approvals?.length || data.extendItems?.length ||
          data.ordinations?.length || data.appointmentItems?.length ||
          data.coordinateItems?.length || data.ordinationNotifications?.length ||
          data.settingAparts?.length || data.clerkReviews?.length ||
          data.interviews?.length || data.ordinationInterviewSchedules?.length ||
          data.ordinationInterviews?.length || data.ordinationReports?.length ||
          data.ordinationCertificates?.length ||

    function renderCCSection(items, highCouncilors, stakePresidency) {
      const canReassign = userData.canReassign || false;
      highCouncilors = highCouncilors || [];
      stakePresidency = stakePresidency || [];

      // Split items into open and completed
      const openItems = items.filter(item => item.status !== 'Completed');
      const completedItems = items.filter(item => item.status === 'Completed');

      let html = '';

      // Open CC items section
      if (openItems.length > 0) {
        html += '<div class="section cc-section"><div class="section-header expanded" onclick="toggleSection(\'ccOpen\')"><div class="section-title">📎 CC\'d Items</div><div class="section-meta">' + helpBtn('ccOpen') + '<span class="section-count">' + openItems.length + '</span><span class="chevron">▼</span></div></div>';
        html += '<div class="section-content expanded" id="section-ccOpen"><div class="section-inner">';

        openItems.forEach(item => {
          const isExtendCalling = item.type === 'extend-calling' || item.actionType === 'extend-calling';
          const isExtendRelease = item.type === 'extend-release' || item.actionType === 'extend-release';
          const isExtend = isExtendCalling || isExtendRelease;
          const isSBConfirm = item.actionType === 'stake-business-confirm';
          const isSustainingReport = item.actionType === 'sustaining-report';

          // Sustaining-report CCs get the SAME per-item buttons + doc link + Mark All Remaining
          // as the primary view. Reassign button appears for SP/clerks/secretaries.
          if (isSustainingReport) {
            html += renderSustainingReportItem(item, { isCC: true, canReassign: canReassign });
            return;
          }
          const ccApptText = item.appointmentStatus || (isExtend ? 'Pending' : '');
          const appointmentStatusHtml = ccApptText ?
            `<div class="item-meta" style="${ccApptText === 'Pending' ? 'color:#856404' : 'color:#28a745'};font-style:italic;">Appointment: ${escapeHtmlDisplay(ccApptText)}</div>` : '';
          let appointmentControls = '';
          if (isExtend && (!item.appointmentStatus || item.appointmentStatus === 'Pending')) {
            appointmentControls = `<div style="display:flex;gap:6px;align-items:center;margin-top:6px;flex-wrap:wrap;">
              <input type="date" id="apptDate_${item.actionId}" class="form-input" style="width:auto;font-size:12px;">
              <input type="time" id="apptTime_${item.actionId}" class="form-input" style="width:auto;font-size:12px;">
              <button class="btn btn-primary btn-sm" onclick="scheduleAppointment('${item.actionId}')">📅 Appointment Scheduled</button>
            </div>`;
          }

          // Stake-business-confirm CC items get the same buttons as the primary view.
          // Both High Councilors AND Stake Presidency appear in the replacement dropdown.
          // The Check-with-Backup / Unavailable button picks the same path the primary does,
          // based on the backupHC + isReassigned hints parsed from notes.
          if (isSBConfirm) {
            const sbVisibleNotes = (item.notes || '')
              .split('\n')
              .filter(l => !/^(Backup HC:|Reassigned:|Original HC:)/i.test(l))
              .join(' · ');
            const sbMeetingTimeLine = item.meetingTime ? `<div class="item-meta">⛪ Sacrament: ${escapeHtmlDisplay(item.meetingTime)}</div>` : '';
            const replacementCandidates = []
              .concat(highCouncilors.map(u => ({ id: u.id, name: u.name, group: 'High Council' })))
              .concat(stakePresidency.map(u => ({ id: u.id, name: u.name, group: 'Stake Presidency' })))
              .filter(u => u.id !== userId);
            const sbReplacementOptions = replacementCandidates
              .map(u => `<option value="${u.id}">${escapeHtmlDisplay(u.name)} (${u.group})</option>`)
              .join('');

            const sbShowCheckBackup = item.backupHC && !item.isReassigned;

    function renderApprovalStatusSection(items) {
      // Group by phase for quick scanning. Each row gets a progress bar (approved / total approvers)
      // and a one-line "Waiting on:" list for the named approvers who still need to vote.
      // Defaults to COLLAPSED — this is reference info, not an action item.
      let html = '<div class="section info-section"><div class="section-header" onclick="toggleSection(\'approvalStatus\')"><div class="section-title">📊 Approval / Sustaining Status</div><div class="section-meta">' + helpBtn('approvalStatus') + '<span class="section-count">' + items.length + '</span><span class="chevron">▼</span></div></div>';
      html += '<div class="section-content" id="section-approvalStatus"><div class="section-inner">';

      items.forEach(item => {
        const totalApprovers = (item.approvedBy?.length || 0) + (item.waitingOn?.length || 0) + (item.opposed?.length || 0);
        const approvedCount = item.approvedBy?.length || 0;
        const opposedCount = item.opposed?.length || 0;
        const pct = totalApprovers > 0 ? Math.round((approvedCount / totalApprovers) * 100) : 0;

        const typeLabel = item.type === 'release-only' ? '↩ Release'
                        : item.type === 'ordination'   ? '🙏 Ordination'
                        : '📋 Calling';
        const titleLine = `${escapeHtmlDisplay(item.member || 'N/A')} — ${escapeHtmlDisplay(item.calling || 'N/A')}${item.ward ? ' (' + escapeHtmlDisplay(item.ward) + ')' : ''}`;

        const barColor = opposedCount > 0 ? '#dc3545' : (pct >= 100 ? '#28a745' : '#5865F2');
        const progressBar = `
          <div style="display:flex;align-items:center;gap:8px;margin:6px 0;">
            <div style="flex:1;height:6px;background:#e8e8e8;border-radius:3px;overflow:hidden;">
              <div style="width:${pct}%;height:100%;background:${barColor};transition:width .3s;"></div>
            </div>
            <span style="font-size:12px;color:#666;white-space:nowrap;">${approvedCount} / ${totalApprovers}${opposedCount > 0 ? ' • ' + opposedCount + ' opposed' : ''}</span>
          </div>`;

        const approvedNames = (item.approvedBy || []).map(a => escapeHtmlDisplay(a.name)).join(', ');
        const waitingNames = (item.waitingOn || []).map(a => escapeHtmlDisplay(a.name)).join(', ');
        const opposedNames = (item.opposed || []).map(a => escapeHtmlDisplay(a.name)).join(', ');

        html += `<div class="item">
          <div class="item-header">
            <div class="item-title">${titleLine}</div>
            <div class="item-badges"><span class="badge badge-info">${typeLabel}</span></div>
          </div>
          <div class="item-meta">Phase: ${escapeHtmlDisplay(item.phase || '—')}</div>
          ${progressBar}
          ${approvedNames ? `<div class="item-meta" style="color:#28a745;">✓ Approved: ${approvedNames}</div>` : ''}
          ${waitingNames ? `<div class="item-meta" style="color:#856404;">⏳ Waiting on: ${waitingNames}</div>` : ''}
          ${opposedNames ? `<div class="item-meta" style="color:#dc3545;">⚠️ Opposed: ${opposedNames}</div>` : ''}
        </div>`;
      });

      html += '</div></div></div>';
      return html;
    }

    function helpBtn(key) {
      if (!SECTION_HELP[key]) return '';
      return '<button class="help-btn" onclick="showHelp(event,\'' + key + '\')" title="What is this?" aria-label="What is this section?">?</button>';
    }
    function showHelp(e, key) {
      e.stopPropagation();
      const info = SECTION_HELP[key];
      if (!info) return;
      const pop = document.getElementById('helpPopover');
      pop.innerHTML = '<button class="help-popover-close" onclick="hideHelp()" aria-label="Close">×</button>' +
        '<h4>' + info.title + '</h4>' + info.body;
      pop.classList.add('show');
      const btn = e.currentTarget,
            r = btn.getBoundingClientRect(),
            pr = pop.getBoundingClientRect();
      let top = r.bottom + 8, left = r.right - pr.width;
      if (left < 8) left = 8;
      if (left + pr.width > window.innerWidth - 8) left = window.innerWidth - pr.width - 8;
      if (top + pr.height > window.innerHeight - 8) top = r.top - pr.height - 8;
      if (top < 8) top = 8;
      pop.style.top = top + 'px';
      pop.style.left = left + 'px';
    }
    function hideHelp() {
      const p = document.getElementById('helpPopover');
      if (p) p.classList.remove('show');
    }
    document.addEventListener('click', function(e) {
      const pop = document.getElementById('helpPopover');
      if (!pop || !pop.classList.contains('show')) return;
      if (pop.contains(e.target)) return;
      if (e.target.classList && e.target.classList.contains('help-btn')) return;
      hideHelp();
    });

    // Helper Functions
    function escapeHtml(text) {
      if (!text) return '';
      return String(text).replace(/'/g, '\\\'');
    }

    // UI Functions
    function toggleSection(id, forceOpen) {
      const section = document.getElementById('section-' + id);
      if (!section) return;

      const header = section.previousElementSibling;

      if (forceOpen) {
        section.classList.add('expanded');
        header.classList.add('expanded');
      } else {
        section.classList.toggle('expanded');
        header.classList.toggle('expanded');
      }
    }

    function scrollToSection(id) {
      // First ensure the section is open
      toggleSection(id, true);

      // Then scroll to it smoothly
      const section = document.getElementById('section-' + id);
      if (section) {
        const header = section.previousElementSibling;
        if (header) {

    function parseApptStatusToInputs(apptStatus) {
      if (!apptStatus || apptStatus === 'Pending') return { date: '', time: '' };
      const atIdx = apptStatus.indexOf(' at ');
      const datePart = atIdx !== -1 ? apptStatus.substring(0, atIdx) : apptStatus;
      const timePart = atIdx !== -1 ? apptStatus.substring(atIdx + 4) : '';
      const d = new Date(datePart);
      if (isNaN(d.getTime())) return { date: '', time: '' };
      const dateInput = d.getFullYear() + '-' +
        String(d.getMonth() + 1).padStart(2, '0') + '-' +
        String(d.getDate()).padStart(2, '0');
      let timeInput = '';
      if (timePart) {
        const m = timePart.match(/^(\d+):(\d+)(am|pm)$/i);
        if (m) {
          let h = parseInt(m[1]);
          if (m[3].toLowerCase() === 'pm' && h !== 12) h += 12;
          if (m[3].toLowerCase() === 'am' && h === 12) h = 0;
          timeInput = String(h).padStart(2, '0') + ':' + m[2];
        }
      }
      return { date: dateInput, time: timeInput };
    }

    async function reassignTask(itemId, itemTitle) {
      currentReassignId = itemId;
      currentReassignAppointmentStatus = null;
      document.getElementById('reassignTaskText').textContent = itemTitle;

      const primaryContainer = document.getElementById('reassignPrimaryContainer');
      const ccContainer = document.getElementById('reassignCCContainer');
      const ccGroupSelect = document.getElementById('reassignCCGroup');
      const ccIndividualsGroup = document.getElementById('reassignCCIndividualsGroup');
      const apptWarning = document.getElementById('reassignAppointmentWarning');

      primaryContainer.innerHTML = '<div style="color:#666;font-size:13px;">Loading...</div>';
      ccContainer.innerHTML = '';
      ccGroupSelect.value = 'none';
      ccIndividualsGroup.style.display = 'none';
      apptWarning.style.display = 'none';

      document.getElementById('reassignModal').classList.add('show');

      try {
        const url = `${API_URL}?action=getTaskAssignments&userId=${encodeURIComponent(userId)}&itemId=${encodeURIComponent(itemId)}`;
        const response = await fetch(url, { method: 'GET' });
        if (!response.ok) throw new Error('Failed to load assignments');

        const result = await response.json();
        if (!result.success) throw new Error(result.error || 'Failed to load');

        const primaryIds = result.primaryIds || [];
        const ccIds = result.ccIds || [];
        const rawGroups = result.groups || result.ccGroupMembers || {};

        // Show appointment warning if there's an existing appointment
        currentReassignAppointmentStatus = result.appointmentStatus || null;
        const apptWarning = document.getElementById('reassignAppointmentWarning');
        if (currentReassignAppointmentStatus && currentReassignAppointmentStatus !== 'Pending') {
          const assigneeName = primaryIds.length > 0 ?
            (users.find(u => u.id === primaryIds[0]) || {}).name || 'the current assignee' : 'the current assignee';
          document.getElementById('reassignAppointmentWarningText').textContent =
            assigneeName + ' already has an appointment scheduled on ' + currentReassignAppointmentStatus + '. Do you want to keep this date for the reassigned task?';
          document.getElementById('keepAppointmentCheckbox').checked = true;
          apptWarning.style.display = 'block';
        } else {
          apptWarning.style.display = 'none';
        }

        // Map groups
        ccGroupMembers = {};
        ['stakePresidency', 'extendedSP', 'highCouncil'].forEach(key => {
          const mapped = key === 'stakePresidency' ? 'stake-presidency' :
                        key === 'extendedSP' ? 'extended-stake-presidency' : 'high-council';
          ccGroupMembers[mapped] = (rawGroups[key] || []).map(m => typeof m === 'string' ? m : m.id);
        });

        originalPrimaryIds = primaryIds.slice();

        // Render primary dropdowns
        if (primaryIds.length === 0) {
          primaryContainer.innerHTML = getUserDropdownWithRemove('reassignPrimary_0', 'Select...', '', true);
        } else {
          primaryContainer.innerHTML = '';
          primaryIds.forEach((pid, i) => {
            primaryContainer.insertAdjacentHTML('beforeend', getUserDropdownWithRemove('reassignPrimary_' + i, 'Select...', pid, true));
          });
        }

        // Detect and set CC group
        const detectedGroup = detectCCGroup(ccIds, primaryIds);
        ccGroupSelect.value = detectedGroup;

        if (detectedGroup === 'other') {
          ccIndividualsGroup.style.display = 'block';
          if (ccIds.length === 0) {
            ccContainer.innerHTML = getUserDropdownWithRemove('reassignCC_0', 'None', '', false);
          } else {
            ccContainer.innerHTML = '';
            ccIds.forEach((cid, i) => {
              ccContainer.insertAdjacentHTML('beforeend', getUserDropdownWithRemove('reassignCC_' + i, 'None', cid, false));
            });
          }
        } else {
          ccIndividualsGroup.style.display = 'none';
        }
      } catch (error) {
        showToast('Error loading task details: ' + error.message, 'error');
        closeReassignModal();
      }
    }

    function getUserDropdownWithRemove(id, placeholder, selectedValue, isPrimary) {
      let h = '<div style="display:flex;gap:8px;margin-bottom:6px;align-items:center;"><select class="form-select" id="' + id + '" style="flex:1;"';

    function escapeHtmlDisplay(text) {
      if (!text) return '';
      return String(text).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function detectCCGroup(ccIds, primaryIds) {
      if (ccIds.length === 0) return 'none';

      // Filter out primary assignees from CC list
      const ccSet = new Set(ccIds.filter(id => !primaryIds.includes(id)));
      if (ccSet.size === 0) return 'none';

      // Try exact match first
      for (const [group, members] of Object.entries(ccGroupMembers)) {
        const memberSet = new Set(members);
        if (ccSet.size === memberSet.size && [...ccSet].every(id => memberSet.has(id))) {
          return group;
        }
      }

      // If no exact match, check if all CC members belong to a single group
      // This handles cases where the group membership changed or someone was removed
      for (const [group, members] of Object.entries(ccGroupMembers)) {
        const memberSet = new Set(members);
        const allInGroup = [...ccSet].every(id => memberSet.has(id));

        // If all current CC members are in this group, and they represent
        // at least 50% of the group, assume it's this group
        if (allInGroup && ccSet.size >= memberSet.size * 0.5) {
          return group;
        }
      }

      return 'other';
    }

    async function submitReassign() {
      // Collect primary assignees
      const primarySelects = document.querySelectorAll('[id^="reassignPrimary_"]');
      const primaryIds = Array.from(primarySelects).map(s => s.value).filter(v => v);

      if (primaryIds.length === 0) {
        showToast('Please select at least one primary assignee', 'error');
        return;
      }

      // Collect CC assignees
      let ccIds = [];
      const ccGroup = document.getElementById('reassignCCGroup').value;
      if (ccGroup === 'other') {
        const ccSelects = document.querySelectorAll('[id^="reassignCC_"]');
        ccIds = Array.from(ccSelects).map(s => s.value).filter(v => v);
      } else if (ccGroup !== 'none') {
        ccIds = ccGroupMembers[ccGroup] || [];
      }
      ccIds = ccIds.filter(id => !primaryIds.includes(id));

      const keepAppt = !currentReassignAppointmentStatus ||
        currentReassignAppointmentStatus === 'Pending' ||
        document.getElementById('keepAppointmentCheckbox').checked;

      // Capture these before closing the modal
      const reassignedId = currentReassignId;
      const newPrimaryNames = primaryIds.map(id => {
        const u = users.find(u => u.id === id);
        return u ? u.name : id;
      });

      // Close modal and update UI immediately — don't wait for the API
      closeReassignModal();

      // Optimistically update the "Assigned:" line in all matching item elements
      const baseId = reassignedId.replace(/_[PC]\d*$/, '');
      document.querySelectorAll('[id^="item-' + baseId + '"]').forEach(itemEl => {
        itemEl.querySelectorAll('.item-meta').forEach(div => {
          const t = div.textContent;
          if (t.startsWith('Assigned:') || t.startsWith('Assigned to:')) {
            const prefix = t.startsWith('Assigned to:') ? 'Assigned to: ' : 'Assigned: ';
            div.textContent = prefix + newPrimaryNames.join(', ');
          }
        });
      });

      setSyncing(true);
      try {
        await performAction('reassign', {
          itemId: reassignedId,
          primaryIds: primaryIds.join(','),
          ccIds: ccIds.join(','),
          keepAppointment: keepAppt ? 'true' : 'false'
        });
        showToast('Task reassigned', 'success');
        scheduleSilentRefresh(1000);
      } catch (error) {
        showToast('Error reassigning: ' + error.message, 'error');
        scheduleSilentRefresh(0); // Immediate refresh to restore correct state
      } finally {
        setSyncing(false);
      }
    }

    async function shareUserDashboardLink() {
      const select = document.getElementById('adminUserSelect');
      const selectedUserId = select.value;
      if (!selectedUserId) {
        showToast('Please select a user first', 'error');
        return;
      }
      const link = window.location.origin + window.location.pathname + '?userId=' + encodeURIComponent(selectedUserId);

      // Try the native share sheet first (iOS / Android Chrome).
      // Only share the URL — no title or descriptive text so iOS Messages /
      // Mail / etc. paste just the bare link with no preamble.
      if (navigator.share) {
        try {
          await navigator.share({ url: link });
          return;
        } catch (e) {
          // User cancelling the share sheet throws AbortError — silent.
          if (e && e.name !== 'AbortError') {
            // Fall through to clipboard fallback on real errors.
            console.warn('navigator.share failed, falling back to clipboard:', e);
          } else {
            return;
          }
        }
      }
      // Fallback: clipboard
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try {
          await navigator.clipboard.writeText(link);
          showToast('Link copied to clipboard', 'success');
          return;
        } catch (e) {
          console.warn('clipboard.writeText failed:', e);
        }
      }
      // Last-resort fallback: show a prompt the user can copy manually
      prompt('Copy this link:', link);
    }

        html += '<div class="radio-option' + (isSelected ? ' selected' : '') + '" onclick="saveSetting(\'ccPref\',\'' + o + '\',this)">' + o + '</div>';
      });
      html += '</div></div>';

      html += '</div></div></div>';
      return html;
    }

    function saveSetting(key, val, element) {
      // Update currentData.settings immediately so it persists when toggling settings view
      if (!currentData.settings) currentData.settings = {};
      currentData.settings[key] = val;

      // Use debounced save to prevent race conditions
      debouncedSaveSetting(key, val, element);
    }

    // Create Task Functions
    function openNewTaskModal() {
      document.getElementById('newTaskModal').classList.add('show');
      document.getElementById('taskAssigneeContainer').innerHTML = getUserDropdownWithValue('taskAssignee_0', 'Select...', userId);
      document.getElementById('taskCCContainer').innerHTML = getUserDropdownWithValue('taskCC_0', 'None', '');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.remove('show');
      if (modalId === 'newTaskModal') {
        clearTaskForm();
      }
    }

    function addTaskAssignee() {
      const container = document.getElementById('taskAssigneeContainer');
      const count = container.querySelectorAll('select').length;
      container.insertAdjacentHTML('beforeend', getUserDropdownWithRemove('taskAssignee_' + count, 'Select...', '', false));
    }

    function addTaskCC() {
      const container = document.getElementById('taskCCContainer');
      const count = container.querySelectorAll('select').length;
      container.insertAdjacentHTML('beforeend', getUserDropdownWithRemove('taskCC_' + count, 'None', '', false));
    }

    async function createTask() {
      const desc = document.getElementById('taskDescription').value.trim();
      const date = document.getElementById('taskDueDate').value;
      const time = document.getElementById('taskDueTime').value;
      const notes = document.getElementById('taskNotes').value.trim();

      const primaryIds = [];
      const ccIds = [];

      document.getElementById('taskAssigneeContainer').querySelectorAll('select').forEach(sel => {
        if (sel.value) primaryIds.push(sel.value);
      });

      document.getElementById('taskCCContainer').querySelectorAll('select').forEach(sel => {
        if (sel.value) ccIds.push(sel.value);
      });

      if (!desc || primaryIds.length === 0) {
        showToast('Please fill required fields', 'error');
        return;
      }

      const dueDate = date + (time ? ' ' + time : '');

      setSyncing(true);
      try {
        await performAction('createTask', {
          description: desc,
          primaryIds: primaryIds.join(','),
          ccIds: ccIds.join(','),
          dueDate: dueDate,
          notes: notes
        });

        showToast('Task created', 'success');
        closeModal('newTaskModal');
        scheduleSilentRefresh(1000);
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
      } finally {
        setSyncing(false);
      }
    }

    function clearTaskForm() {
      document.getElementById('taskDescription').value = '';
      document.getElementById('taskDueDate').value = '';
      document.getElementById('taskDueTime').value = '';
      document.getElementById('taskNotes').value = '';
    }

    // ============================================================
    // PRIESTHOOD ORDINATIONS — Sustain All
    // ============================================================

    async function sustainAllOrdinations(btn) {
      if (btn) { btn.disabled = true; btn.textContent = '...'; }
      setSyncing(true);
      try {
        await performAction('sustainAll', {});
        showToast('All ordinations sustained', 'success');
        scheduleSilentRefresh(1000);
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
        if (btn) { btn.disabled = false; btn.textContent = '✓ Sustain All'; }
      } finally {
        setSyncing(false);
      }
    }

    // ============================================================
    // STAKE BUSINESS CONFIRMATIONS
    // ============================================================

    function renderStakeBusinessSection(items, highCouncilors) {
      let html = '<div class="section"><div class="section-header expanded" onclick="toggleSection(\'stakeBusiness\')"><div class="section-title">⛪ Stake Business Confirmations</div><div class="section-meta">' + helpBtn('stakeBusiness') + '<span class="section-count">' + items.length + '</span><span class="chevron">▼</span></div></div>';
      html += '<div class="section-content expanded" id="section-stakeBusiness"><div class="section-inner">';

      items.forEach(item => {
        // HC dropdown excludes the logged-in user (current assignee)
        const hcOptions = highCouncilors
          .filter(u => u.id !== userId)
          .map(u => `<option value="${u.id}">${escapeHtmlDisplay(u.name)}</option>`)
          .join('');

        // Filter the notes display so the "Reassigned: true" / "Backup HC:" hints don't show as user-facing text.
        const visibleNotes = (item.notes || '')
          .split('\n')
          .filter(l => !/^(Backup HC:|Reassigned:|Original HC:)/i.test(l))
          .join(' · ');
        const meetingTimeLine = item.meetingTime ? `<div class="item-meta">⛪ Sacrament: ${escapeHtmlDisplay(item.meetingTime)}</div>` : '';

        // Button choice: if a Backup HC is configured AND the task hasn't been reassigned yet,
        // the negative button is "Check with [Backup]". Otherwise (already escalated, or no backup),
        // the negative button is "Unavailable" which notifies clerks to find a replacement.
        const showCheckBackup = item.backupHC && !item.isReassigned;
        const negativeButton = showCheckBackup
          ? `<button class="btn btn-warning" style="color:#333;" onclick="handleSBCheckBackup('${item.actionId}', this)">↪ Check with ${escapeHtmlDisplay(item.backupHC)}</button>`
          : `<button class="btn btn-danger" onclick="handleSBNeedReplacement('${item.actionId}', this)">✗ Unavailable</button>`;

        html += `<div class="item" id="item-${item.actionId}">
          <div class="item-header"><div class="item-title">${escapeHtmlDisplay(item.displayText || 'N/A')}</div></div>
          ${visibleNotes ? `<div class="item-meta" style="font-style:italic;">${escapeHtmlDisplay(visibleNotes)}</div>` : ''}
          ${meetingTimeLine}
          <div class="item-actions" style="flex-direction:column;align-items:flex-start;gap:10px;margin-top:8px;">
            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-success" onclick="handleSBConfirm('${item.actionId}', this)">✓ Yes, I'll Be There</button>
              ${negativeButton}
            </div>
            <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
              <span style="font-size:13px;color:#555;">Request a replacement:</span>
              <select class="form-select" id="sbReplacement_${item.actionId}" style="width:auto;max-width:240px;font-size:13px;">
                <option value="">Select replacement...</option>
                ${hcOptions}
              </select>
              <button class="btn btn-warning btn-sm" style="color:#333;" onclick="handleSBHaveReplacement('${item.actionId}', this)">↻ Request Replacement</button>
            </div>
          </div>
        </div>`;
      });

      html += '</div></div></div>';
      return html;
    }

    async function handleSBConfirm(actionId, btn) {
      const itemEl = btn ? btn.closest('.item') : null;
      if (itemEl) { itemEl.style.transition = 'opacity 0.2s'; itemEl.style.opacity = '0.25'; itemEl.style.pointerEvents = 'none'; }
      setSyncing(true);
      try {
        await performAction('sbConfirm', { itemId: actionId });
        if (itemEl) itemEl.remove();
        showToast('Confirmed — thank you!', 'success');
        scheduleSilentRefresh();
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
        if (itemEl) { itemEl.style.opacity = '1'; itemEl.style.pointerEvents = ''; }
      } finally { setSyncing(false); }
    }

    /**
     * Render a single sustaining-report item card. Same UI is used by both the primary
     * section and the CC bucket so anyone with the task in front of them can act on it.
     * `opts.isCC` adds a small "CC'd to you" badge in the header; `opts.canReassign` adds
     * the standard Reassign button.
     */
    function renderSustainingReportItem(item, opts) {
      opts = opts || {};
      const ward = item.sustainingReportWard || '';
      const docUrl = item.sustainingReportDocUrl || '';
      const list = item.sustainingReportItems || [];
      const remaining = list.filter(it => typeof it.s === 'undefined');
      const docLink = docUrl ? `<a href="${escapeHtmlDisplay(docUrl)}" target="_blank" rel="noopener" style="font-size:13px;">📄 Stake Business Document</a>` : '';
      const ccBadge = opts.isCC ? ' <span class="badge badge-info" style="font-size:11px;">CC\'d to you</span>' : '';
      const assignedLine = opts.isCC && item.assignedToNames
        ? `<div class="item-meta">Assigned to: ${escapeHtmlDisplay(item.assignedToNames)}</div>`
        : '';

      let body = `<div class="item" id="item-${item.actionId}">
        <div class="item-header"><div class="item-title">${escapeHtmlDisplay(item.displayText || ('Sustainings — ' + ward))}${ccBadge}</div></div>
        ${assignedLine}
        ${docLink ? `<div class="item-meta">${docLink}</div>` : ''}
        <div class="item-meta">Remaining: ${remaining.length} of ${list.length}</div>`;

      list.forEach(it => {
        const isMarked = typeof it.s !== 'undefined';
        const isRelease = String(it.a || '').toLowerCase() === 'release';
        const verbPast = isRelease ? 'Released' : 'Sustained';
        const markedLabel = isMarked
          ? (it.s ? `<span style="color:#28a745;font-weight:600;">✓ ${verbPast}</span>`
                  : `<span style="color:#dc3545;font-weight:600;">✗ Not ${verbPast}</span>`)
          : '';
        const buttons = isMarked
          ? ''
          : `<div style="display:flex;gap:6px;margin-top:4px;">
              <button class="btn btn-success btn-sm" onclick="handleSustainingMark('${item.actionId}', ${it.i}, true, this)">✓ ${verbPast}</button>
              <button class="btn btn-warning btn-sm" style="color:#333;" onclick="handleSustainingMark('${item.actionId}', ${it.i}, false, this)">✗ Not ${verbPast}</button>
            </div>`;
        const stakeBadge = String(it.where || '').toLowerCase() === 'stake' ? ' <span class="badge badge-info">Stake</span>' : '';
        const releaseBadge = isRelease ? ' <span class="badge badge-warning" style="color:#333;">Release</span>' : '';
        body += `<div style="border-top:1px solid #eee;padding:8px 0;">
          <div><strong>${escapeHtmlDisplay(it.m || '')}</strong> — ${escapeHtmlDisplay(it.c || '')} (${escapeHtmlDisplay(it.w || '')})${releaseBadge}${stakeBadge}</div>
          ${markedLabel ? `<div style="margin-top:4px;">${markedLabel}</div>` : ''}
          ${buttons}
        </div>`;
      });

      const trailingButtons = [];
      if (remaining.length > 0) {
        trailingButtons.push(`<button class="btn btn-primary" onclick="handleSustainingMarkAll('${item.actionId}', this)">✓ Mark All Remaining Complete</button>`);
      }
      if (opts.canReassign) {
        trailingButtons.push(`<button class="btn btn-secondary btn-sm" onclick="reassignTask('${item.actionId}', '${escapeHtml(item.displayText || '')}')">↻ Reassign</button>`);
      }
      if (trailingButtons.length > 0) {
        body += `<div style="margin-top:10px;display:flex;gap:8px;flex-wrap:wrap;">${trailingButtons.join('')}</div>`;
      }

      body += `</div>`;
      return body;
    }

    function renderSustainingReportSection(items) {
      const canReassign = userData.canReassign || false;
      let html = '<div class="section"><div class="section-header expanded" onclick="toggleSection(\'sustainingReports\')"><div class="section-title">🙋 Sustainings/Releasings to Report</div><div class="section-meta">' + helpBtn('sustainingReports') + '<span class="section-count">' + items.length + '</span><span class="chevron">▼</span></div></div>';
      html += '<div class="section-content expanded" id="section-sustainingReports"><div class="section-inner">';
      items.forEach(item => { html += renderSustainingReportItem(item, { isCC: false, canReassign: canReassign }); });
      html += '</div></div></div>';
      return html;
    }

    async function handleSustainingMark(actionId, sbRow, sustained, btn) {
      setSyncing(true);
      try {
        await performAction('sustainingReportMark', { itemId: actionId, sbRow: sbRow, sustained: sustained ? 'true' : 'false' });
        showToast(sustained ? 'Marked sustained' : 'Marked not sustained', 'success');
        scheduleSilentRefresh();
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
      } finally { setSyncing(false); }
    }

    async function handleSustainingMarkAll(actionId, btn) {
      if (!confirm('Mark every remaining item as sustained?')) return;
      setSyncing(true);
      try {
        await performAction('sustainingReportAll', { itemId: actionId });
        showToast('All items marked sustained', 'success');
        scheduleSilentRefresh();
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
      } finally { setSyncing(false); }
    }

    async function handleSBCheckBackup(actionId, btn) {
      if (!confirm('This will pass the request to the backup high councilor. Continue?')) return;
      const itemEl = btn ? btn.closest('.item') : null;
      if (itemEl) { itemEl.style.transition = 'opacity 0.2s'; itemEl.style.opacity = '0.25'; itemEl.style.pointerEvents = 'none'; }
      setSyncing(true);
      try {
        await performAction('sbCheckBackup', { itemId: actionId });
        if (itemEl) itemEl.remove();
        showToast('Backup high councilor has been notified', 'success');
        scheduleSilentRefresh();
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
        if (itemEl) { itemEl.style.opacity = '1'; itemEl.style.pointerEvents = ''; }
      } finally { setSyncing(false); }
    }

    async function handleSBNeedReplacement(actionId, btn) {
      if (!confirm('This will mark you as unavailable and notify the stake clerks to find a replacement. Continue?')) return;
      const itemEl = btn ? btn.closest('.item') : null;
      if (itemEl) { itemEl.style.transition = 'opacity 0.2s'; itemEl.style.opacity = '0.25'; itemEl.style.pointerEvents = 'none'; }
      setSyncing(true);
      try {
        await performAction('sbNeedReplacement', { itemId: actionId });
        if (itemEl) itemEl.remove();
        showToast('Clerks have been notified', 'success');
        scheduleSilentRefresh();
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
        if (itemEl) { itemEl.style.opacity = '1'; itemEl.style.pointerEvents = ''; }
      } finally { setSyncing(false); }
    }

    async function handleSBHaveReplacement(actionId, btn) {
      const sel = document.getElementById('sbReplacement_' + actionId);
      const replacementId = sel ? sel.value : '';
      if (!replacementId) {
        showToast('Please select a replacement HC first', 'error');
        return;
      }
      const itemEl = btn ? btn.closest('.item') : null;
      if (itemEl) { itemEl.style.transition = 'opacity 0.2s'; itemEl.style.opacity = '0.25'; itemEl.style.pointerEvents = 'none'; }
      setSyncing(true);
      try {
        await performAction('sbHaveReplacement', { itemId: actionId, replacementId: replacementId });
        if (itemEl) itemEl.remove();
        showToast('Replacement assigned and notified', 'success');
        scheduleSilentRefresh();
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
        if (itemEl) { itemEl.style.opacity = '1'; itemEl.style.pointerEvents = ''; }
      } finally { setSyncing(false); }
    }

    // ============================================================
    // ORDINATION REPORT
    // ============================================================

    let currentOrdinationReportItemId = null;

    function openOrdinationReportModal(itemId) {
      currentOrdinationReportItemId = itemId;
      document.getElementById('ordRepDateOrdained').value = '';
      document.getElementById('ordRepOrdainerName').value = '';
      document.getElementById('ordRepOrdainerBirthDate').value = '';
      document.getElementById('ordRepOrdainerMRN').value = '';
      document.getElementById('ordRepOrdainerOffice').value = '';
      document.getElementById('ordRepStakeRepName').value = '';
      document.getElementById('ordRepStakeRepCalling').value = '';
      document.getElementById('ordinationReportModal').classList.add('show');
    }

    function closeOrdinationReportModal() {
      document.getElementById('ordinationReportModal').classList.remove('show');
      currentOrdinationReportItemId = null;
    }

    async function submitOrdinationReport() {
      const dateOrdained = document.getElementById('ordRepDateOrdained').value;
      const ordainerName = document.getElementById('ordRepOrdainerName').value.trim();
      const ordainerBirthDate = document.getElementById('ordRepOrdainerBirthDate').value;
      if (!dateOrdained || !ordainerName || !ordainerBirthDate) {
        showToast('Please fill in required fields (date, ordainer name, birth date)', 'error');
        return;
      }
      setSyncing(true);
      try {
        await performAction('submitOrdinationReport', {
          itemId: currentOrdinationReportItemId,
          dateOrdained: dateOrdained,
          ordainerName: ordainerName,
          ordainerBirthDate: ordainerBirthDate,
          ordainerMRN: document.getElementById('ordRepOrdainerMRN').value.trim(),
          ordainerOffice: document.getElementById('ordRepOrdainerOffice').value.trim(),
          stakeRepName: document.getElementById('ordRepStakeRepName').value.trim(),
          stakeRepCalling: document.getElementById('ordRepStakeRepCalling').value.trim()
        });
        const itemEl = document.getElementById('item-' + currentOrdinationReportItemId);
        if (itemEl) itemEl.remove();
        showToast('Ordination reported — thank you!', 'success');
        closeOrdinationReportModal();
        scheduleSilentRefresh(1000);
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
      } finally {
        setSyncing(false);
      }
    }

    // ============================================================
    // ORDINATION SUSTAINING — Report Sustained + Transfer
    // ============================================================

    async function handleReportSustaining(actionId, btn) {
      const itemEl = btn ? btn.closest('.item') : null;
      if (itemEl) { itemEl.style.transition = 'opacity 0.2s'; itemEl.style.opacity = '0.25'; itemEl.style.pointerEvents = 'none'; }
      setSyncing(true);
      try {
        await performAction('reportSustaining', { itemId: actionId });
        if (itemEl) itemEl.remove();
        showToast('Sustaining reported', 'success');
        scheduleSilentRefresh(1000);
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
        if (itemEl) { itemEl.style.opacity = '1'; itemEl.style.pointerEvents = ''; }
      } finally {
        setSyncing(false);
      }
    }

    async function handleTransferOrdinationNotification(actionId, btn) {
      const sel = document.getElementById('hcTransfer_' + actionId);
      const newAssigneeId = sel ? sel.value : '';
      if (!newAssigneeId) {
        showToast('Please select a high councilor to transfer to', 'error');
        return;
      }
      const itemEl = btn ? btn.closest('.item') : null;
      if (itemEl) { itemEl.style.transition = 'opacity 0.2s'; itemEl.style.opacity = '0.25'; itemEl.style.pointerEvents = 'none'; }
      setSyncing(true);
      try {
        await performAction('transferOrdinationNotification', {
          itemId: actionId,
          newAssigneeId: newAssigneeId
        });
        if (itemEl) itemEl.remove();
        showToast('Task transferred', 'success');
        scheduleSilentRefresh(1000);
      } catch (error) {
        showToast('Error: ' + error.message, 'error');
        if (itemEl) { itemEl.style.opacity = '1'; itemEl.style.pointerEvents = ''; }
      } finally {
        setSyncing(false);
      }
    }

    // Service Worker for PWA (optional but makes it a true PWA)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // We'll add this later if needed
      });
    }
  </script>
